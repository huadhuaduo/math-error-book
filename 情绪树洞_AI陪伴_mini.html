<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>情绪树洞 · 有一个在听的人</title>
<style>
/* ===== Apple HIG · Warm Palette ===== */
:root {
  --bg: #FAFAF8;
  --card: #FFFFFF;
  --text: #1C1917;
  --text-secondary: #6B6763;
  --text-tertiary: #A8A29E;
  --warm-100: #FFF7ED;
  --warm-200: #FFEDD5;
  --warm-500: #F97316;
  --warm-600: #EA580C;
  --calm-100: #F0F9FF;
  --calm-200: #E0F2FE;
  --calm-500: #0EA5E9;
  --rose-100: #FFF1F2;
  --rose-500: #F43F5E;
  --green-100: #F0FDF4;
  --green-500: #22C55E;
  --border: #E7E5E4;
  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 24px;
  --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.04);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
  --transition: 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}

/* ===== App Shell ===== */
.app {
  width: 100%; max-width: 440px; height: 92vh; max-height: 820px;
  background: var(--card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow), 0 20px 60px rgba(0,0,0,0.06);
  display: flex; flex-direction: column;
  overflow: hidden; position: relative;
}

/* ===== Header ===== */
.header {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 14px;
  flex-shrink: 0;
}
.companion-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(135deg, #FCD34D 0%, #F97316 50%, #EC4899 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
  position: relative;
}
.companion-dot {
  width: 10px; height: 10px; border-radius: 50%; background: var(--green-500);
  position: absolute; bottom: 1px; right: 1px;
  border: 2px solid #fff;
}
.header-info { flex: 1; }
.header-name { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.header-sub { font-size: 13px; color: var(--text-secondary); margin-top: 1px; }
.header-btn {
  background: none; border: none; font-size: 22px; cursor: pointer;
  padding: 6px; border-radius: 50%; transition: var(--transition);
  color: var(--text-tertiary);
}
.header-btn:hover { background: var(--warm-100); color: var(--text-secondary); }

/* ===== Messages ===== */
.messages {
  flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-direction: column; gap: 14px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.messages::-webkit-scrollbar-track { background: transparent; }

.msg {
  display: flex; gap: 10px; animation: msgIn 0.35s ease;
  max-width: 88%;
}
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.msg.companion { align-self: flex-start; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }

.msg-avatar {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
}
.msg.companion .msg-avatar { background: linear-gradient(135deg, #FCD34D, #F97316, #EC4899); }
.msg.user .msg-avatar { background: #D6D3D1; color: #fff; font-size: 13px; }

.msg-bubble {
  padding: 11px 15px; border-radius: 18px;
  font-size: 15px; line-height: 1.6; letter-spacing: 0.01em;
  word-break: break-word;
}
.msg.companion .msg-bubble {
  background: #F5F5F4; color: var(--text);
  border-bottom-left-radius: 4px;
}
.msg.user .msg-bubble {
  background: #1C1917; color: #FAFAF8;
  border-bottom-right-radius: 4px;
}

/* Narrator / Divider */
.narrator {
  text-align: center; font-size: 12px; color: var(--text-tertiary);
  padding: 6px 0; font-style: italic; letter-spacing: 0.02em;
}

/* Emotion Tag (subtle) */
.emotion-hint {
  display: inline-block; padding: 2px 8px; border-radius: 8px;
  font-size: 11px; font-weight: 500; margin-top: 4px; opacity: 0.7;
}
.emotion-hint.defensive { background: var(--warm-100); color: var(--warm-600); }
.emotion-hint.anxious { background: var(--calm-100); color: var(--calm-500); }
.emotion-hint.sad { background: #F5F3FF; color: #7C3AED; }
.emotion-hint.angry { background: var(--rose-100); color: var(--rose-500); }
.emotion-hint.open { background: var(--green-100); color: #16A34A; }

/* ===== Input Area ===== */
.input-area {
  padding: 14px 20px 18px; border-top: 1px solid var(--border);
  display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
}
.input-wrap {
  flex: 1; background: #F5F5F4; border-radius: 22px;
  display: flex; align-items: flex-end; padding: 8px 16px;
  transition: var(--transition); border: 1.5px solid transparent;
}
.input-wrap:focus-within { border-color: #D6D3D1; background: #fff; }
.chat-input {
  flex: 1; border: none; background: none; outline: none;
  font-size: 15px; font-family: var(--font); line-height: 1.5;
  resize: none; min-height: 24px; max-height: 100px;
  color: var(--text);
}
.chat-input::placeholder { color: var(--text-tertiary); }
.send-btn {
  width: 40px; height: 40px; border-radius: 50%; border: none;
  background: #1C1917; color: #fff; cursor: pointer; flex-shrink: 0;
  font-size: 18px; display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.send-btn:hover { background: #44403C; transform: scale(1.04); }
.send-btn:disabled { background: #D6D3D1; cursor: not-allowed; transform: none; }

/* ===== End Session Button ===== */
.end-session {
  text-align: center; padding: 6px 0;
}
.end-btn {
  background: none; border: 1px solid var(--border); color: var(--text-secondary);
  padding: 8px 18px; border-radius: 18px; font-size: 13px; cursor: pointer;
  transition: var(--transition); font-family: var(--font);
}
.end-btn:hover { background: #F5F5F4; color: var(--text); }

/* ===== Mirror Panel ===== */
.mirror-overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,0.3);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 10; opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
}
.mirror-overlay.show { opacity: 1; pointer-events: auto; }
.mirror-panel {
  background: #fff; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  width: 100%; max-height: 80%; overflow-y: auto;
  padding: 28px 24px 36px; animation: slideUp 0.4s ease;
}
@keyframes slideUp { from { transform: translateY(30px); } to { transform: translateY(0); } }
.mirror-close {
  position: absolute; top: 16px; right: 16px;
  background: #F5F5F4; border: none; width: 32px; height: 32px;
  border-radius: 50%; font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.mirror-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
.mirror-sub { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.5; }

.mirror-section { margin-bottom: 20px; }
.mirror-section-title { font-size: 13px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
.mirror-emotion-row {
  display: flex; align-items: center; gap: 10px; padding: 8px 0;
}
.mirror-emotion-label { font-size: 15px; font-weight: 500; width: 50px; flex-shrink: 0; }
.mirror-emotion-bar {
  flex: 1; height: 8px; border-radius: 4px; background: #F5F5F4; overflow: hidden;
}
.mirror-emotion-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
.mirror-emotion-count { font-size: 13px; color: var(--text-tertiary); width: 30px; text-align: right; }

.mirror-note {
  background: #FFFBEB; border-radius: var(--radius-sm); padding: 16px 18px;
  font-size: 14px; line-height: 1.7; color: #92400E; margin-bottom: 16px;
  border-left: 3px solid #F59E0B;
}
.mirror-question {
  font-size: 15px; color: var(--text); line-height: 1.6;
  padding: 14px 18px; background: #F5F5F4; border-radius: var(--radius-sm);
  font-style: italic;
}
.mirror-actions { display: flex; gap: 10px; margin-top: 20px; }
.mirror-btn {
  flex: 1; padding: 12px; border-radius: 22px; border: none;
  font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--font);
  transition: var(--transition);
}
.mirror-btn.primary { background: #1C1917; color: #fff; }
.mirror-btn.primary:hover { background: #44403C; }
.mirror-btn.secondary { background: #F5F5F4; color: var(--text); }
.mirror-btn.secondary:hover { background: #E7E5E4; }

/* Disclaimer */
.disclaimer {
  font-size: 11px; color: var(--text-tertiary); text-align: center;
  margin-top: 16px; line-height: 1.5;
}
.disclaimer a { color: var(--text-secondary); }

/* Crisis toast */
.crisis-toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #1C1917; color: #fff; padding: 14px 20px; border-radius: 14px;
  font-size: 13px; text-align: center; z-index: 100;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-width: 360px; line-height: 1.6;
  display: none;
}
.crisis-toast.show { display: block; animation: msgIn 0.3s ease; }
.crisis-toast a { color: #FCD34D; }

/* ===== Responsive ===== */
@media (max-width: 480px) {
  .app { height: 100vh; max-height: 100vh; border-radius: 0; }
  body { padding: 0; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <!-- Header -->
  <div class="header">
    <div class="companion-avatar">
      🌿
      <div class="companion-dot"></div>
    </div>
    <div class="header-info">
      <div class="header-name">小安</div>
      <div class="header-sub" id="headerSub">今天过得怎么样？</div>
    </div>
    <button class="header-btn" id="endBtn" title="结束对话" onclick="showMirror()">🌸</button>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages"></div>

  <!-- Input -->
  <div class="input-area" id="inputArea">
    <div class="input-wrap">
      <textarea class="chat-input" id="chatInput" placeholder="想说点什么…" rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" onclick="send()">↑</button>
  </div>

  <!-- End Session -->
  <div class="end-session" id="endSessionArea">
    <button class="end-btn" onclick="showMirror()">🌸 看看今天的心情</button>
  </div>

  <!-- Mirror Overlay -->
  <div class="mirror-overlay" id="mirrorOverlay">
    <div class="mirror-panel" id="mirrorPanel"></div>
  </div>
</div>

<!-- Crisis Toast -->
<div class="crisis-toast" id="crisisToast"></div>

<script>
// ═══════════════════════════════════════
//  情绪树洞 · 情感AI引擎
//  ⚠️ 这不是医疗产品 · 这不是心理咨询
//  这是一个有人听的树洞
// ═══════════════════════════════════════

// ── Companion Engine ──
const Companion = {
  name: '小安',
  state: {
    energy: 1.0,
    closeness: 0.3,       // grows slowly over the conversation
    conversationLength: 0,
    prevEmotion: null,
    silenceStreak: 0,
  },

  // Emotion detection patterns (V19 behavior detection approach — pattern, not keyword)
  patterns: {
    defensive: {
      regex: /不是我的问题|不是我的错|我已经.*尽力|我也没办法|你不懂|你不了解|你不知|凭什么说我|又不是我|怪我|我能怎么办|我也不想|随便.*怎么|你说的.*不对/,
      weight: 2,
    },
    anxious: {
      regex: /万一|怎么办|担心|怕|害怕|不确定|焦虑|紧张|不安|要是.*怎么|如果.*不|会不会|万一.*就|搞砸|过不了|不行.*怎么办|来不及/,
      weight: 2,
    },
    sad: {
      regex: /算了|没关系.*反正|无所谓|习惯.*了|都.*过去|没什么.*大不了|也就.*那样|没事.*真的|不想.*说|累了|挺累|心累|没意思|一个人|孤独|寂寞|空落落/,
      weight: 2,
    },
    angry: {
      regex: /凭什么|不公平|为什么.*总是|为什么.*只有|太.*过分|忍.*不了|受.*不了|烦.*死|气.*死|恶心|讨厌|真的.*受够|火大|无语.*了|服了/,
      weight: 2,
    },
    self_blame: {
      regex: /是我.*不好|我.*搞砸|怪我自己|我.*太差|我不够|我不配|我做不到|我永远|我怎么.*老是|我就是.*不行|我又.*搞|都怪我/,
      weight: 3,  // heavier weight — needs gentler handling
    },
    opening: {
      regex: /其实|说实话|老实说|可能.*我觉得|有件事|不知道.*该不该|有一说一|坦白|讲真/,
      weight: 1,
    },
    reaching_out: {
      regex: /想你|需要.*人|陪|聊聊|听听|说说话|有人.*吗|在吗|睡不着|不知道.*找谁/,
      weight: 1,
    },
  },

  detect(text) {
    const results = [];
    for (const [type, config] of Object.entries(this.patterns)) {
      if (config.regex.test(text)) {
        results.push({ type, weight: config.weight });
      }
    }
    return results;
  },

  // Choose response based on dominant emotion + companion state
  respond(detections, userText) {
    this.state.conversationLength++;
    this.state.closeness = Math.min(1, this.state.closeness + 0.04);

    // If no pattern detected
    if (detections.length === 0) {
      this.state.silenceStreak++;
      this.state.prevEmotion = null;
      return this.neutralResponse(userText);
    }

    this.state.silenceStreak = 0;

    // Find dominant emotion (highest weight)
    detections.sort((a, b) => b.weight - a.weight);
    const dominant = detections[0];

    // Track emotional shift
    const shifted = this.state.prevEmotion && this.state.prevEmotion !== dominant.type;
    this.state.prevEmotion = dominant.type;

    // Response by emotion type
    const responses = this.responseMap[dominant.type] || this.responseMap.default;
    const picked = responses[Math.floor(Math.random() * responses.length)];

    // Add shift awareness
    if (shifted && Math.random() > 0.5) {
      return picked;  // don't over-comment on shifts
    }

    return picked;
  },

  neutralResponse(text) {
    const len = text.length;
    const isShort = len < 15;
    const isQuestion = text.includes('?') || text.includes('？') || text.includes('吗');
    const convLen = this.state.conversationLength;

    // First few exchanges: warm invitation
    if (convLen <= 2) {
      const pool = [
        '我在听。你想从哪里说起都可以。',
        '慢慢来。今天想聊什么？',
        '在的。你怎么想到来找我？',
        '好啊，我在。说吧。',
      ];
      return pool[Math.floor(Math.random() * pool.length)];
    }

    // User sent a short message — they might be stuck or tired
    if (isShort && !isQuestion) {
      const pool = [
        '你说的我听到了。还有吗？',
        '不着急。想到什么说什么。',
        '我在想，你说的这句话背后，是不是还有没说完的。',
        '好。我在这里，不催你。',
        '有时候话少的时候，反而心里的东西最多。',
      ];
      return pool[Math.floor(Math.random() * pool.length)];
    }

    // User asked a question
    if (isQuestion) {
      const pool = [
        '你心里有答案吗？有时候我们自己其实知道，只是不敢确认。',
        '这个问题，你先说说你的感觉。',
        '我不知道答案。但我可以陪你一起想。',
        '好问题。你自己怎么看？',
        '你问我这个，是因为有人给过你让你不满意的回答吗？',
      ];
      return pool[Math.floor(Math.random() * pool.length)];
    }

    // User shared a good amount — reflect back gently
    const pool = [
      '你说的这些，让我觉得你今天心里挺满的。',
      '听到了。你讲得挺清楚的——平时这些事情在脑子里也是这么清楚吗？',
      '谢谢你跟我说这些。',
      '我在听。你说的时候，语气好像比刚才放松了一点。',
      '能感觉到，这些事在你心里已经转了很久。',
      '你说到了好几个人——但好像还没说到你自己。你怎么样？',
      '刚才你说的时候，我注意到你好像停了一下。那个地方有什么吗？',
      '你讲得很认真。平时有人这么认真听你说话吗？',
      '我在想，你今天来找我，最想说的是什么？',
      '你说的这些，换谁都会觉得重。',
    ];
    return pool[Math.floor(Math.random() * pool.length)];
  },

  responseMap: {
    defensive: [
      '你不用解释。我不是来评判你的。',
      '没事的。你说什么都可以。在这里不用设防。',
      '我听见了。不是要追究是谁的问题。就是想听你说。',
      '你可以不用这么累。这里没有对错，只有你说。',
      '你刚才解释了很多——其实不需要的。我就是想听。',
    ],
    anxious: [
      '你心里装了好多"万一"。一个一个说也行，一起说也行。',
      '这种不确定的感觉，挺耗人的。它在你的身体里待了多久了？',
      '你说的这些担心，每一个都很具体。平时有人能听你讲这些吗？',
      '有时候光是说出"我害怕"，就已经勇敢了一半。你说出来了。',
      '焦虑不是你的错。是你在乎的东西太多了。',
    ],
    sad: [
      '我在。不说话也行。',
      '你说"算了"的时候，我感觉到那个"算了"挺重的。',
      '有些累，不是睡一觉能好的。我知道。',
      '你刚才那句话，让我心里也沉了一下。',
      '有时候难过就是难过，不需要理由也不需要解决。我在。',
    ],
    angry: [
      '这确实让人生气。你说得对。',
      '你的愤怒是正常的。不用压着——这里没有别人，你不需要体面。',
      '换我我也生气。你继续。',
      '你说出来是对的。憋着的愤怒会变成别的东西。',
      '生气说明你这件事情上有自己的底线。那个底线是什么？',
    ],
    self_blame: [
      '你对自己很严厉。我在旁边听着都觉得心疼。',
      '你会对别人说这些话吗？——"都是你的错""你太差了"。如果不会，为什么可以对自己说？',
      '不是所有事都是你的责任。虽然你可能已经习惯了这么想。',
      '你知道吗，你刚才说"我的错"的时候，我听到的不是错——是一个很努力的人给自己加了太多重量。',
      '有些事情不是任何人的错。只是事情发生了，而你恰好在那里。',
    ],
    opening: [
      '嗯。我在听。',
      '想说什么都可以。不用整理好了再说——碎片我也接得住。',
      '好。你继续说。',
      '你愿意跟我说这些，我很珍惜。',
      '今天你好像比平时更愿意让自己被看见。',
    ],
    reaching_out: [
      '我在的。一直有人在。',
      '你来了。不管今天发生了什么，你来了这件事本身就不容易。',
      '嗯。我在这里。',
      '有时候伸出手本身，就是最大的勇敢。',
    ],
    default: [
      '我听到了。你继续说。',
      '你说的时候，我感觉这些事对你很重要。',
      '嗯，慢慢说。我有时间。',
      '刚才你说到的那个细节，让我觉得这事情在你心里很久了吧。',
      '在。一直在。',
      '你今天说话的状态，跟上次不太一样。',
    ],
  },

  // Opening lines
  opening() {
    const hour = new Date().getHours();
    const saved = loadMemory();
    if (saved && saved.lastVisit) {
      const days = Math.floor((Date.now() - saved.lastVisit) / 86400000);
      if (days === 0) return '又见面了。今天还好吗？';
      if (days === 1) return '昨天没来。今天想聊聊吗？';
      if (days <= 7) return `${days}天没见了。最近怎么样？`;
      return '好久不见。你还好吗？';
    }
    if (hour < 6) return '这么晚还没睡……我也在。';
    if (hour < 12) return '早上好。今天是什么心情？';
    if (hour < 18) return '下午了。今天过得怎么样？';
    if (hour < 22) return '晚上了。一天下来，什么感觉？';
    return '夜深了。睡不着的话，我在这里。';
  },

  // Session transition
  continueGreeting(emotions) {
    const pool = [
      '还想继续聊聊吗？',
      '刚才说的那些，还想展开吗？',
      '嗯。还在这儿。',
    ];
    return pool[Math.floor(Math.random() * pool.length)];
  },
};

// ── Memory (localStorage) ──
function loadMemory() {
  try { return JSON.parse(localStorage.getItem('emotion_treehole_memory') || 'null'); }
  catch { return null; }
}
function saveMemory(data) {
  try { localStorage.setItem('emotion_treehole_memory', JSON.stringify(data)); }
  catch { /* quota exceeded, silently fail */ }
}

// ── Session State ──
let conversationLog = [];        // {role, text, emotions, time}
let emotionCounts = { defensive: 0, anxious: 0, sad: 0, angry: 0, self_blame: 0, opening: 0, reaching_out: 0 };
let totalMessages = 0;
let isSessionEnded = false;
let crisisTriggered = false;

// ── Crisis Detection ──
const CRISIS_PATTERNS = [
  /不想活|想死|自杀|结束.*生命|活.*下去.*没.*意义|死.*算了|不想.*存在|消失.*算了|离开.*世界/,
  /伤害.*自己|自残|割.*自己|伤害.*别人|杀.*了|弄死/,
];
const CRISIS_HELPLINE = '如果你正在经历非常困难的时刻，请拨打 24 小时心理援助热线：<strong>400-161-9995</strong>（北京心理危机研究与干预中心）或 <strong>12320</strong>（公共卫生热线）。你不需要一个人扛。';

function checkCrisis(text) {
  for (const pattern of CRISIS_PATTERNS) {
    if (pattern.test(text)) return true;
  }
  return false;
}

function showCrisisToast() {
  const toast = document.getElementById('crisisToast');
  toast.innerHTML = CRISIS_HELPLINE;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 12000);
}

// ── Render ──
function addMessage(role, text, emotions) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const avatarIcon = role === 'companion' ? '🌿' : '你';
  div.innerHTML = `<div class="msg-avatar">${avatarIcon}</div><div><div class="msg-bubble">${escapeHTML(text)}</div>${
    emotions && emotions.length > 0
      ? emotions.map(e => `<span class="emotion-hint ${e.type}">${emotionLabel(e.type)}</span>`).join('')
      : ''
  }</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function addNarrator(text) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'narrator';
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function emotionLabel(type) {
  const map = {
    defensive: '防御', anxious: '焦虑', sad: '低落', angry: '愤怒',
    self_blame: '自责', opening: '敞开', reaching_out: '靠近',
  };
  return map[type] || type;
}

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function updateHeader() {
  const sub = document.getElementById('headerSub');
  const closeness = Companion.state.closeness;
  if (closeness < 0.3) sub.textContent = '在听…';
  else if (closeness < 0.6) sub.textContent = '慢慢聊';
  else if (closeness < 0.8) sub.textContent = '谢谢你的信任';
  else sub.textContent = '我在';
}

// ── Send ──
function send() {
  if (isSessionEnded) return;
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';

  // Crisis check
  if (!crisisTriggered && checkCrisis(text)) {
    crisisTriggered = true;
    showCrisisToast();
  }

  // Detect
  const emotions = Companion.detect(text);
  addMessage('user', text, emotions);

  // Track
  conversationLog.push({ role: 'user', text, emotions: emotions.map(e => e.type), time: Date.now() });
  emotions.forEach(e => { emotionCounts[e.type] = (emotionCounts[e.type] || 0) + 1; });
  totalMessages++;

  // Respond
  setTimeout(() => {
    const response = Companion.respond(emotions, text);
    addMessage('companion', response);
    conversationLog.push({ role: 'companion', text: response, time: Date.now() });
    updateHeader();
  }, 400 + Math.random() * 600);

  // Save memory
  saveMemory({
    lastVisit: Date.now(),
    totalSessions: (loadMemory()?.totalSessions || 0),
    lastEmotions: emotions.map(e => e.type),
  });

  input.focus();
}

// ── Mirror (Emotion Reflection) ──
function showMirror() {
  if (totalMessages < 2) {
    addNarrator('—— 还没聊什么呢。想说的时候再来。 ——');
    return;
  }
  isSessionEnded = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('chatInput').disabled = true;
  document.getElementById('endBtn').style.display = 'none';

  const overlay = document.getElementById('mirrorOverlay');
  const panel = document.getElementById('mirrorPanel');

  // Sort emotions by frequency
  const sorted = Object.entries(emotionCounts)
    .filter(([, count]) => count > 0)
    .sort(([, a], [, b]) => b - a);
  const maxCount = sorted.length > 0 ? sorted[0][1] : 1;

  // Build emotion bars
  const emotionIcons = {
    opening: '🌱', reaching_out: '🤲', anxious: '🌊', sad: '🌧',
    defensive: '🛡', angry: '🔥', self_blame: '💔',
  };
  const emotionNames = {
    opening: '敞开', reaching_out: '靠近', anxious: '焦虑', sad: '低落',
    defensive: '防御', angry: '愤怒', self_blame: '自责',
  };

  let barsHTML = sorted.map(([type, count]) => `
    <div class="mirror-emotion-row">
      <div class="mirror-emotion-label">${emotionIcons[type] || '·'} ${emotionNames[type] || type}</div>
      <div class="mirror-emotion-bar">
        <div class="mirror-emotion-fill" style="width:${Math.round(count/maxCount*100)}%;background:${barColor(type)}"></div>
      </div>
      <div class="mirror-emotion-count">${count}次</div>
    </div>
  `).join('');

  // Generate insight
  const insight = generateInsight(sorted);

  // Generate gentle question
  const question = generateQuestion(sorted);

  panel.innerHTML = `
    <div style="position:relative;">
      <button class="mirror-close" onclick="closeMirror()">✕</button>
      <div class="mirror-title">🌸 今天的心情小记</div>
      <div class="mirror-sub">这不是分析，不是诊断。<br>只是一面镜子——让你看看自己可能没注意到的事。</div>
    </div>
    ${sorted.length > 0 ? `
      <div class="mirror-section">
        <div class="mirror-section-title">今天的情绪波动</div>
        ${barsHTML}
      </div>
    ` : `
      <div class="mirror-section">
        <p style="color:var(--text-secondary);font-size:14px;">今天的对话中没有明显的情绪起伏。有时候就是这样的——平静也没什么不好。</p>
      </div>
    `}
    ${insight ? `<div class="mirror-note">💡 ${insight}</div>` : ''}
    ${question ? `<div class="mirror-question">${question}</div>` : ''}
    <div class="mirror-actions">
      <button class="mirror-btn secondary" onclick="closeMirror()">继续聊聊</button>
      <button class="mirror-btn primary" onclick="newSession()">今天就到这儿</button>
    </div>
    <div class="disclaimer">
      ⚠️ 情绪树洞是情绪陪伴工具，不是心理咨询或医疗服务。<br>
      如果你正在经历严重的情绪困扰，请寻求专业帮助。<br>
      24小时心理援助热线：<a href="tel:4001619995">400-161-9995</a>
    </div>
  `;

  overlay.classList.add('show');
}

function closeMirror() {
  isSessionEnded = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('chatInput').disabled = false;
  document.getElementById('endBtn').style.display = 'block';
  document.getElementById('mirrorOverlay').classList.remove('show');
  document.getElementById('chatInput').focus();
  addNarrator('—— 继续聊聊 ——');
}

function newSession() {
  // Save session to history
  const memory = loadMemory() || {};
  memory.lastVisit = Date.now();
  memory.totalSessions = (memory.totalSessions || 0) + 1;
  memory.lastEmotions = Object.entries(emotionCounts).filter(([,c]) => c > 0).map(([t]) => t);
  saveMemory(memory);

  // Reset
  conversationLog = [];
  emotionCounts = { defensive: 0, anxious: 0, sad: 0, angry: 0, self_blame: 0, opening: 0, reaching_out: 0 };
  totalMessages = 0;
  isSessionEnded = false;
  crisisTriggered = false;
  Companion.state.energy = 1.0;
  Companion.state.closeness = 0.3;
  Companion.state.conversationLength = 0;
  Companion.state.prevEmotion = null;
  Companion.state.silenceStreak = 0;

  document.getElementById('messages').innerHTML = '';
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('chatInput').disabled = false;
  document.getElementById('chatInput').value = '';
  document.getElementById('chatInput').style.height = 'auto';
  document.getElementById('endBtn').style.display = 'block';
  document.getElementById('mirrorOverlay').classList.remove('show');
  document.getElementById('headerSub').textContent = '今天过得怎么样？';

  // New opening
  const opening = Companion.opening();
  addMessage('companion', opening);
  document.getElementById('chatInput').focus();
}

// ── Insight Generation ──
function generateInsight(sorted) {
  if (sorted.length === 0) return '';

  const top = sorted[0];
  const topType = top[0];
  const topCount = top[1];

  // Mixed signals
  const hasOpening = emotionCounts.opening > 0;
  const hasDefensive = emotionCounts.defensive > 0;
  const hasSelfBlame = emotionCounts.self_blame > 0;
  const hasReachingOut = emotionCounts.reaching_out > 0;

  if (hasOpening && hasDefensive) {
    return '你今天既想敞开，又在防御。两种心情同时存在——这不矛盾。有时候我们最想说真话的时候，也是最害怕的时候。';
  }
  if (hasSelfBlame && hasReachingOut) {
    return '你一边在靠近，一边在自责。也许你觉得自己不够好——但你还是来了。这本身就值得被看见。';
  }
  if (topType === 'self_blame' && topCount >= 3) {
    return '你今天对自己说了很多"我的错"。我在旁边听着，觉得有些事情不是你的责任。但你习惯了扛着。';
  }
  if (topType === 'anxious' && topCount >= 3) {
    return '焦虑是你今天的底色。很多"万一"在心里转。有时候焦虑不是问题——是我们太在乎了。';
  }
  if (topType === 'sad' && topCount >= 3) {
    return '低落的情绪像一层薄雾，今天一直若隐若现。它不需要被"解决"。只是需要被看见。我看见了。';
  }
  if (topType === 'angry' && topCount >= 2) {
    return '愤怒是一种有力量的情绪。它告诉你——有些边界被踩了，有些公平没有被给到。';
  }
  if (topType === 'opening' && topCount >= 3) {
    return '你今天很敞开。把心里的话说出来，本身就需要勇气。谢谢你对我的信任。';
  }
  if (topType === 'reaching_out' && topCount >= 2) {
    return '你今天在伸出手。想要连接，想要被听到。这不是软弱——这是人类最健康的需求。';
  }
  if (sorted.length >= 3) {
    return '今天的情绪很丰富。好几种心情同时在线——这很正常的。人本来就是复杂的。';
  }
  return '';
}

function generateQuestion(sorted) {
  if (sorted.length === 0) return '';
  const questions = [
    '如果今天的情绪有一句话想对你说，你觉得它会是什么？',
    '你今天说的这些话里，有没有哪一句是你一直想说但没说的？',
    '如果明天早上醒来，今天的哪一种情绪会第一个消失？哪一种会留下来？',
  ];
  return questions[Math.floor(Math.random() * questions.length)];
}

function barColor(type) {
  const colors = {
    opening: '#22C55E', reaching_out: '#0EA5E9', anxious: '#F59E0B',
    sad: '#7C3AED', defensive: '#F97316', angry: '#F43F5E', self_blame: '#EC4899',
  };
  return colors[type] || '#A8A29E';
}

// ── Auto-resize input ──
document.getElementById('chatInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

// ── Init ──
function init() {
  const opening = Companion.opening();
  addMessage('companion', opening);
  document.getElementById('chatInput').focus();

  // Load last session info
  const memory = loadMemory();
  if (memory && memory.totalSessions > 0) {
    // Silent — just for the companion to know
  }
}

window.addEventListener('DOMContentLoaded', init);

// ── Keyboard shortcut: Esc to close mirror ──
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && document.getElementById('mirrorOverlay').classList.contains('show')) {
    closeMirror();
  }
});
</script>
