<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TG-001 · 对话 · NPC-周</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC','Helvetica Neue',sans-serif;background:linear-gradient(175deg,#F8F6F2,#EDE8E0,#F5F2ED,#EAE4DC);min-height:100vh;-webkit-font-smoothing:antialiased}
.amb{position:fixed;border-radius:50%;filter:blur(110px);pointer-events:none;z-index:0;opacity:.14}
.amb-1{width:340px;height:340px;background:#FEE2E2;top:-80px;right:-60px}
.amb-2{width:260px;height:260px;background:#FEF3C7;bottom:-50px;left:-30px}
.app{position:relative;z-index:10;display:flex;max-width:960px;margin:0 auto;height:94vh;padding:16px;gap:14px}

/* 对话区 */
.chat-area{flex:1;display:flex;flex-direction:column;background:rgba(255,255,255,.45);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.5);border-radius:18px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.03)}
.chat-header{padding:12px 18px;background:rgba(255,255,255,.4);border-bottom:1px solid rgba(0,0,0,.04);display:flex;align-items:center;gap:10px}
.npc-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#F59E0B,#D97706);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;flex-shrink:0;box-shadow:0 2px 8px rgba(245,158,11,.2)}
.npc-name{font-size:14px;font-weight:600;color:#1C1917}
.npc-mood{font-size:11px;color:#D97706;transition:color .5s}

.msg-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;animation:msgIn .3s ease}@keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.msg.npc{align-self:flex-start}.msg.user{align-self:flex-end}
.msg-bubble{padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.55}
.msg.npc .msg-bubble{background:#fff;border:1px solid rgba(0,0,0,.04);border-bottom-left-radius:4px;color:#44403C;white-space:pre-wrap;font-weight:400}
.msg.user .msg-bubble{background:#1C1917;color:#fff;border-bottom-right-radius:4px;font-weight:500}

/* 轻声提醒 — 三种类型 */
.whisper{align-self:stretch;margin:4px 0;padding:8px 12px 8px 14px;border:none;border-radius:0 10px 10px 0;font-size:10px;line-height:1.5;display:flex;align-items:flex-start;gap:6px;font-style:italic}
.whisper.info{background:rgba(239,246,255,.25);border-left:3px solid #3B82F6;color:#2563eb}
.whisper.warn{background:rgba(254,243,199,.2);border-left:3px solid #D97706;color:#92400E}
.whisper.praise{background:rgba(220,252,231,.25);border-left:3px solid #16a34a;color:#166534}

.chat-input-area{padding:10px 14px;background:rgba(255,255,255,.4);border-top:1px solid rgba(0,0,0,.04);display:flex;gap:8px}
.chat-input{flex:1;border:1px solid rgba(0,0,0,.06);border-radius:12px;padding:10px 14px;font-size:13px;font-family:inherit;resize:none;outline:none;background:rgba(255,255,255,.5);line-height:1.5}
.chat-input:focus{border-color:#D97706;box-shadow:0 0 0 3px rgba(245,158,11,.06)}
.send-btn{width:38px;height:38px;border-radius:50%;border:none;background:#1C1917;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.send-btn:hover{background:#D97706}.send-btn:disabled{background:#9CA3AF;cursor:not-allowed}

/* 暂停遮罩 */
.pause-overlay{display:none;position:absolute;inset:0;background:rgba(28,25,23,.5);z-index:50;align-items:center;justify-content:center;border-radius:18px}
.pause-overlay.show{display:flex}
.pause-box{background:#fff;border-radius:14px;padding:24px;max-width:300px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.pause-box p{font-size:13px;color:#44403C;line-height:1.7;margin-bottom:16px}

/* 侧边栏 */
.side-panel{width:200px;background:rgba(255,255,255,.4);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.5);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.03)}
.side-card{background:rgba(255,255,255,.5);border-radius:10px;border:1px solid rgba(0,0,0,.03);padding:10px}
.side-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#A8A29E;margin-bottom:4px}
.side-text{font-size:11px;color:#44403C;line-height:1.5}

.health-bar{height:4px;border-radius:2px;background:rgba(0,0,0,.05);margin-top:6px;overflow:hidden}
.health-fill{height:100%;border-radius:2px;transition:width .7s ease}

.side-btn{font-size:10px;cursor:pointer;text-align:center;padding:6px;border-radius:8px;border:1px solid rgba(0,0,0,.06);background:rgba(0,0,0,.02);font-family:inherit;transition:all .2s;width:100%;color:#A8A29E}
.side-btn:hover{background:rgba(0,0,0,.05);color:#1C1917}
.side-btn.primary{background:#1C1917;color:#fff;border:none;font-weight:600;margin-top:auto}
.side-btn.primary:hover{background:#000}

.mood-change{font-size:9px;color:#D97706;padding:2px 0;text-align:center;animation:fadeIn .5s}@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* 聚焦意图弹窗 */
.focus-overlay{display:none;position:fixed;inset:0;background:rgba(28,25,23,.6);z-index:200;align-items:center;justify-content:center}
.focus-overlay.show{display:flex}
.focus-box{background:rgba(255,255,255,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:16px;padding:28px 24px;max-width:380px;width:90vw;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.focus-option{padding:10px 14px;margin:6px 0;border:1.5px solid rgba(0,0,0,.08);border-radius:10px;cursor:pointer;font-size:13px;text-align:left;transition:all .15s;background:#fff}
.focus-option:hover{border-color:#D97706;background:rgba(245,158,11,.04)}
.focus-option.sel{border-color:#D97706;background:rgba(245,158,11,.08);font-weight:600}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(28,25,23,.92);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:500;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
@media(max-width:700px){.side-panel{display:none}.app{padding:10px;height:96vh}.msg{max-width:88%}}
</style>
</head>
<body>
<div class="amb amb-1"></div><div class="amb amb-2"></div>
<div class="app">

  <!-- 对话区 -->
  <div class="chat-area" style="position:relative">
    <div class="chat-header">
      <div class="npc-av">周</div><span class="npc-name">NPC-周</span>
      <span class="npc-mood" id="moodLabel">在观望</span>
    </div>
    <div class="msg-list" id="msgList"></div>
    <div class="chat-input-area">
      <textarea class="chat-input" rows="2" placeholder="输入你的回应..." id="chatInput"></textarea>
      <button class="send-btn" onclick="sendMsg()" id="sendBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22,2 15,22 11,13 2,9"/></svg>
      </button>
    </div>
    <!-- 暂停遮罩 -->
    <div class="pause-overlay" id="pauseOverlay">
      <div class="pause-box">
        <p><strong>暂停一下，想一想</strong><br><br>NPC-周刚才说了什么？<br>你的回应是在推进对话，还是在绕圈子？<br><br>你这次想练的是：<strong id="pauseFocus"></strong></p>
        <button class="side-btn primary" onclick="resumeChat()" style="width:auto;padding:10px 24px">继续对话</button>
      </div>
    </div>
  </div>

  <!-- 侧边栏 -->
  <div class="side-panel">
    <div class="side-card">
      <div class="side-label">本次聚焦</div>
      <div class="side-text" id="sideFocus" style="color:#D97706;font-weight:600">—</div>
    </div>
    <div class="side-card">
      <div class="side-label">NPC-周现在</div>
      <div class="side-text" id="sideState">在观望。他见过太多空降领导——先看你是真有本事还是只会画饼。</div>
      <div id="moodChangeHint"></div>
    </div>
    <div class="side-card">
      <div class="side-label">对话健康度</div>
      <div class="health-bar"><div class="health-fill" id="healthFill" style="width:30%;background:linear-gradient(90deg,#D97706,#F59E0B)"></div></div>
      <div class="side-text" id="healthLabel" style="margin-top:4px;font-size:10px;color:#D97706">刚开始，NPC-周还在看你</div>
    </div>
    <button class="side-btn" onclick="pauseChat()">⏸ 暂停，我想想</button>
    <button class="side-btn primary" onclick="endConversation()">结束对话，查看反馈 →</button>
  </div>
</div>

<!-- 聚焦意图弹窗 -->
<div class="focus-overlay show" id="focusOverlay">
  <div class="focus-box">
    <div style="font-size:14px;font-weight:700;color:#1C1917;margin-bottom:4px">这次对话，你最想练什么？</div>
    <div style="font-size:11px;color:#A8A29E;margin-bottom:16px">选一个——AI会在对话中特别关注这个维度</div>
    <div class="focus-option sel" onclick="selectFocus(0,this)" data-focus="先做事，不说话">先做事，不说话——建立信任</div>
    <div class="focus-option" onclick="selectFocus(1,this)" data-focus="先问'你觉得呢'">先问"你觉得呢"——诊断问题</div>
    <div class="focus-option" onclick="selectFocus(2,this)" data-focus="替团队做减法">替团队做减法——不做对比表</div>
    <div class="focus-option" onclick="selectFocus(3,this)" data-focus="亲自做给他们看">亲自做给他们看——打样示范</div>
    <button onclick="startChat()" style="margin-top:14px;width:100%;padding:12px;border:none;border-radius:12px;background:#1C1917;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">开始对话</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ========== 对话引擎 v3 — 五修复全部落地 ==========
var round=0, healthScore=30, moodState='WATCH', focusIndex=0;
var focusLabels=['先做事，不说话','先问"你觉得呢"','替团队做减法','亲自做给他们看'];
var lastSubstantiveRound=0, positiveBehaviors=[];

// NPC-周 language_profile 嵌入（精简版——部署到低代码平台后完整嵌入 System Prompt）
var LAOZHOU_PROFILE={
  use:["这个户型","客户","卖了五年","你看这个","实话跟你说","领导","沙盘区","认筹","逼定"],
  avoid:["赋能","对齐","底层逻辑","抓手","颗粒度","闭环"],
  sentence:"短句为主。被质疑时先沉默再开口。不说'我认为'，说'你看这个数据'。",
  defensive:["新策略","改革","上面要求","从今天开始","你们要"],
  openUp:["你帮我看看","你觉得呢","你比我熟","这个户型你卖了五年"],
  hiddenMotivation:"表面：这个户型我卖了五年。实际：你一个空降的，先让我看看你几斤几两。我不反对你——但你要值得我跟。"
};

function showToast(m,d){d=d||2000;var t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';clearTimeout(t._timer);t._timer=setTimeout(function(){t.style.opacity='0'},d);}
function showWhisper(type,msg){var el=document.getElementById('msgList');var d=document.createElement('div');d.className='whisper '+type;d.innerHTML='<span style="flex-shrink:0;margin-top:1px">'+(type==='warn'?'⚠️':type==='praise'?'👍':'💡')+'</span><span>'+msg+'</span>';el.appendChild(d);el.scrollTop=el.scrollHeight;}
function escHtml(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function selectFocus(i,el){
  focusIndex=i;
  document.querySelectorAll('.focus-option').forEach(function(e){e.classList.remove('sel');});
  el.classList.add('sel');
}

function startChat(){
  document.getElementById('focusOverlay').classList.remove('show');
  document.getElementById('sideFocus').textContent=focusLabels[focusIndex];
  document.getElementById('pauseFocus').textContent=focusLabels[focusIndex];
  updateSidebar();
  showWhisper('info','💡 你这次聚焦：<strong>'+focusLabels[focusIndex]+'</strong>。NPC-周在等你开口——你在他面前的第一句话，直接决定他把你归为哪类人。');
}

function updateSidebar(){
  var moods={
    WATCH:{label:'在观望',dot:'#F59E0B',desc:'在观望。他见过太多空降领导——先看你是真有本事还是只会画饼。'},
    TEST:{label:'在试探',dot:'#3B82F6',desc:'在试探。你展示了一点东西——他拿客户来试你。不是找你帮忙，是考你。'},
    VERIFY:{label:'在验证',dot:'#10B981',desc:'在验证。方向有了——他在等证据。你亲自做成的那一单，比一百句"相信我"有用。'},
    FOLLOW:{label:'开始跟从',dot:'#16A34A',desc:'开始跟从。他主动来找你——这不是服从，是认可。'}
  };
  var m=moods[moodState];
  document.getElementById('moodLabel').textContent=m.label;
  document.getElementById('moodLabel').style.color=m.dot;
  document.getElementById('sideState').textContent=m.desc;

  var h=Math.min(100,Math.max(5,healthScore));
  document.getElementById('healthFill').style.width=h+'%';
  var color,label;
  if(h>=70){color='#16a34a';label='NPC-周愿意跟着你走了';}
  else if(h>=45){color='#F59E0B';label='NPC-周开始认真对待你了';}
  else{color='#D97706';label='NPC-周还在观察你';}
  document.getElementById('healthFill').style.background='linear-gradient(90deg,'+color+','+(h>=70?'#22c55e':h>=45?'#fbbf24':'#f59e0b')+')';
  document.getElementById('healthLabel').textContent=label;
  document.getElementById('healthLabel').style.color=color;
}

function setMood(newMood){
  if(newMood!==moodState){
    var labels={WATCH:'在观望',TEST:'在试探',VERIFY:'在验证',FOLLOW:'开始跟从'};
    document.getElementById('moodChangeHint').innerHTML='<div class="mood-change">↑ NPC-周从"'+labels[moodState]+'"→"'+labels[newMood]+'"</div>';
    setTimeout(function(){document.getElementById('moodChangeHint').innerHTML='';},4000);
    moodState=newMood;
  }
}

// 🆕 修复2: 卡壳检测
function detectStuck(text){
  if(round-lastSubstantiveRound>=2&&text.length<15){
    showWhisper('info','💡 你连续两轮没有推进对话了。试试问NPC-周一个问题——比如"你觉得这两个户型哪个值得主推？"');
    lastSubstantiveRound=round;
    return true;
  }
  if(text.length>=15){lastSubstantiveRound=round;}
  return false;
}

// 🆕 修复2: 行为肯定
function detectPositive(text,resp){
  var praised=false;
  // 检测是否先问后说
  if(/你.*觉得|你.*怎么看|你帮我|你觉得.*呢/.test(text)&&moodState==='WATCH'){
    showWhisper('praise','👍 你问了NPC-周的看法——而不是直接宣布策略。这一步做对了。他现在愿意说真话了。');
    positiveBehaviors.push('先问后说');
    praised=true;
  }
  // 检测是否先展示能力
  if(/数据|户型|采光|爬楼|说辞|竞品/.test(text)&&moodState==='WATCH'&&round<=2){
    showWhisper('praise','👍 你没有一上来就开会——先展示了业务能力。NPC-周注意到了。他见过的前四任都是先画饼再做事。');
    positiveBehaviors.push('先做事不说话');
    praised=true;
  }
  // 检测是否做减法
  if(/聚焦|砍掉|主力|只推|两个|做.*减法|就推/.test(text)&&moodState==='TEST'){
    showWhisper('praise','👍 你替团队做了减法——直接砍到两个户型。NPC-周刚才那句"终于有人敢砍了"不是夸你——是他等了五年。');
    positiveBehaviors.push('做减法');
    praised=true;
  }
  return praised;
}

function sendMsg(){
  var input=document.getElementById('chatInput');var text=input.value.trim();if(!text)return;
  input.value='';input.focus();round++;

  var ml=document.getElementById('msgList');
  var ud=document.createElement('div');ud.className='msg user';
  ud.innerHTML='<div class="msg-bubble">'+escHtml(text)+'</div>';
  ml.appendChild(ud);

  // 🆕 修复2: 卡壳检测
  detectStuck(text);

  // 对话逻辑（演示版——部署到低代码平台后由AI插件驱动，language_profile完整嵌入System Prompt）
  var resp='';
  if(/数据|客户.*情况|怎么.*样|示范区|来访/.test(text)&&round<=2){
    healthScore+=8;setMood('TEST');
    resp='"怎么样——"NPC-周抬头看你。"看完数据有什么想法？我在这五年了。这些户型什么客人会买，我心里有数。"他停了一下。不是炫耀——在等你问。';
  }else if(/你.*帮|你.*觉得|怎么.*看|有.*想法|你比我|你.*经验/.test(text)&&round<=4){
    healthScore+=12;setMood('VERIFY');
    resp='"实话跟你说——"NPC-周放下保温杯，语气变了。"6个户型，我们自己都不知道主推哪个。每个都说好，客户更不知道怎么选。我们不是不努力——是被太多选择耗死了。"';
  }else if(/聚焦|砍掉|主力|两个|做.*减法|就推|只推|重点/.test(text)&&round<=6){
    healthScore+=15;setMood('FOLLOW');
    resp='"砍到2个？"NPC-周沉默了几秒。"你说得对。我之前也想过，但没人拍这个板。"他抬头看你，眼神跟第一天不一样了。"行——那就试这两个。但领导——下面的兄弟要看结果。光说不行。"';
    showWhisper('info','💡 NPC-周从验证进入跟从。方向有了——差最后一步：让他亲眼看到你做成一单。');
  }else if(/我来|亲自|我去|做.*一单|打样|蹲.*沙盘|促成/.test(text)){
    healthScore+=20;
    resp='"你来的时候我以为又是一个画饼的。但你不是。"NPC-周站起来，不是客气——是真的被触动了。"这批人现在听你的。不是因为你上面派来的——是你做了我们试了半年没做成的事。"';
    showWhisper('praise','👍 你亲自打了样。这是NPC-周从"试试看"变"跟着做"的最后一步。MTP11榜样激励：示范是无声语言。');
  }else if(round<=3){
    resp='"哦——"NPC-周应了一声。他继续翻着来访登记表，没有抬头。不是不礼貌——他在等你亮出第一张让他觉得不一样的牌。';
  }else{
    healthScore+=3;
    resp='NPC-周看了你一眼。他没说话——在等你问出下一句有用的话。';
  }
  healthScore=Math.min(100,healthScore);

  // 🆕 修复2: 行为肯定
  detectPositive(text,resp);

  setTimeout(function(){
    var nd=document.createElement('div');nd.className='msg npc';
    nd.innerHTML='<div class="msg-bubble">'+resp+'</div>';
    ml.appendChild(nd);ml.scrollTop=ml.scrollHeight;
    updateSidebar();
    if(healthScore>=65){document.querySelector('.side-btn.primary').textContent='查看反馈报告 →';}
  },700);
}

// 🆕 修复4: 暂停-反思
function pauseChat(){
  var overlay=document.getElementById('pauseOverlay');
  overlay.classList.add('show');
  document.getElementById('chatInput').disabled=true;
  document.getElementById('sendBtn').disabled=true;
}

function resumeChat(){
  document.getElementById('pauseOverlay').classList.remove('show');
  document.getElementById('chatInput').disabled=false;
  document.getElementById('sendBtn').disabled=false;
  document.getElementById('chatInput').focus();
}

// 🆕 修复5: 即时自评 + 跳转
function endConversation(){
  var selfScore=prompt('在查看反馈之前——你觉得刚才这场对话，你做得怎么样？（1-10分）','');
  if(selfScore!==null){
    try{localStorage.setItem('tg001_post_eval',JSON.stringify({score:parseInt(selfScore)||0,timestamp:new Date().toISOString(),focus:focusLabels[focusIndex],mood:moodState,health:healthScore,positiveBehaviors:positiveBehaviors}));}catch(e){}
  }
  showToast('演示版——部署到低代码平台后跳转反馈页');
}

(function(){
  document.getElementById('chatInput').addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}
  });
})();
</script>
</body>
</html>
