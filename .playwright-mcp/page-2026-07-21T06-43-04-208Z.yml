    - generic [ref=e21]: 启悟学习社区，英文名Open Insight。启悟，取义启迪、领悟，体现社区定位，即启迪智慧、领悟知识的众创社区。Open Insight分别有“启”和“悟”之意，Open可让人联想至开源（Open Source），Insight在信息技术领域常让人联想至代码编辑器（Source Insight）。将Source藏起来，作为社区的灵魂，也是需要各位“悟”出的道理。希望各位“开源启智，码上开悟”，在人工智能开源生态中增长才干、分享智慧、贡献力量。
