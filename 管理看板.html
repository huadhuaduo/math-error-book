<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>管理看板 · AI 管理陪练</title>
<style>
  :root {
    --bg: #f5f5f7;
    --text-primary: #1d1d1f;
    --text-secondary: #86868b;
    --text-tertiary: #6e6e73;
    --accent-blue: #0071e3;
    --accent-green: #34c759;
    --accent-orange: #ff9500;
    --accent-red: #ff3b30;
    --accent-purple: #af52de;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-lg: 20px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif;background:var(--bg);color:var(--text-primary);-webkit-font-smoothing:antialiased;min-height:100vh}
  .nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,.06);padding:0 24px}
  .nav-inner{max-width:1160px;margin:0 auto;display:flex;align-items:center;height:52px;gap:8px}
  .nav-logo{font-size:16px;font-weight:700;color:var(--text-primary);text-decoration:none;margin-right:24px;display:flex;align-items:center;gap:8px}
  .nav-logo::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent-green)}
  .nav-links{display:flex;gap:4px}
  .nav-links a{font-size:13px;color:var(--text-secondary);text-decoration:none;padding:6px 14px;border-radius:8px;transition:all .15s}
  .nav-links a:hover{color:var(--text-primary);background:rgba(0,0,0,.03)}
  .nav-links a.active{color:var(--accent-green);font-weight:600;background:rgba(52,199,89,.05)}
  .nav-title{font-size:17px;font-weight:700;letter-spacing:-0.01em}
  .container{max-width:1080px;margin:0 auto;padding:28px 24px 60px}

  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:28px}
  .kpi-card{background:#fff;border-radius:var(--radius-md);padding:20px;border:1px solid rgba(0,0,0,.06);box-shadow:var(--shadow-sm)}
  .kpi-value{font-size:32px;font-weight:700;letter-spacing:-0.03em;margin-bottom:2px}
  .kpi-label{font-size:12px;color:var(--text-secondary)}
  .kpi-sub{font-size:11px;color:var(--text-tertiary);margin-top:4px}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
  .panel{background:#fff;border-radius:var(--radius-lg);padding:20px;border:1px solid rgba(0,0,0,.06);box-shadow:var(--shadow-sm)}
  .panel h3{font-size:15px;font-weight:600;letter-spacing:-0.01em;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .panel h3 .ico{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}

  .rank-list{display:flex;flex-direction:column;gap:8px}
  .rank-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(0,0,0,.015);border-radius:var(--radius-sm);font-size:13px}
  .rank-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
  .rank-num.gold{background:#FEF3C7;color:#92400E}
  .rank-num.silver{background:#F1F5F9;color:#475569}
  .rank-num.bronze{background:#FEF2F2;color:#991B1B}
  .rank-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;flex-shrink:0;background:linear-gradient(135deg,var(--accent-blue),var(--accent-purple))}
  .rank-name{flex:1;font-weight:500}
  .rank-stats{display:flex;gap:16px;font-size:11px;color:var(--text-secondary)}
  .rank-stats strong{color:var(--text-primary);font-size:13px}

  .bar-chart{display:flex;flex-direction:column;gap:10px}
  .bar-row{display:flex;align-items:center;gap:10px;font-size:12px}
  .bar-label{width:80px;text-align:right;color:var(--text-secondary);flex-shrink:0;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-track{flex:1;height:8px;background:rgba(0,0,0,.04);border-radius:4px;overflow:hidden}
  .bar-fill{height:100%;border-radius:4px;transition:width .6s ease}
  .bar-fill.blue{background:var(--accent-blue)}
  .bar-fill.green{background:var(--accent-green)}
  .bar-fill.purple{background:var(--accent-purple)}
  .bar-fill.orange{background:var(--accent-orange)}
  .bar-value{width:32px;font-size:11px;font-weight:600;color:var(--text-primary);text-align:right;flex-shrink:0}

  .weakness-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .weakness-card{text-align:center;padding:14px 10px;border-radius:var(--radius-sm);background:rgba(0,0,0,.015)}
  .weakness-score{font-size:22px;font-weight:700;margin-bottom:2px}
  .weakness-label{font-size:11px;color:var(--text-secondary);line-height:1.3}

  .empty-state{text-align:center;padding:40px 20px;color:var(--text-secondary);font-size:13px;line-height:1.6}

  @media(max-width:768px){
    .nav{padding:0 14px}
    .container{padding:16px 14px 48px}
    .grid-2{grid-template-columns:1fr}
    .kpi-row{grid-template-columns:repeat(2,1fr)}
    .kpi-value{font-size:24px}
    .bar-label{width:60px}
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="陪练首页.html" class="nav-logo">AI 管理陪练</a>
    <div class="nav-links">
      <a href="陪练首页.html">首页</a>
      <a href="preview_MTP陪练专区.html">全部场景</a>
      <a href="练习记录.html">记录</a>
    </div>
    <span class="nav-title" style="margin-left:auto">管理看板</span>
  </div>
</nav>

<div class="container">

  <!-- Class Selector -->
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap">
    <label style="font-size:13px;font-weight:600;color:var(--text-primary)">班级：</label>
    <select id="classFilter" onchange="filterByClass()" style="padding:8px 14px;border:1px solid rgba(0,0,0,.1);border-radius:8px;font-size:13px;font-family:inherit;background:#fff;min-width:180px">
      <option value="">全部班级</option>
    </select>
    <span style="font-size:11px;color:var(--text-secondary)" id="classMemberCount"></span>
    <span style="margin-left:auto;font-size:11px;color:var(--text-tertiary)">管理员专用 · 数据需50人次以上练习</span>
  </div>

  <!-- KPI Row -->
  <div class="kpi-row">
    <div class="kpi-card">
      <div class="kpi-value" style="color:var(--accent-blue)" id="kpiTotal">0</div>
      <div class="kpi-label">总练习人次</div>
      <div class="kpi-sub" id="kpiTotalSub"></div>
    </div>
    <div class="kpi-card">
      <div class="kpi-value" style="color:var(--accent-green)" id="kpiUsers">0</div>
      <div class="kpi-label">活跃用户</div>
      <div class="kpi-sub" id="kpiUsersSub"></div>
    </div>
    <div class="kpi-card">
      <div class="kpi-value" style="color:var(--accent-orange)" id="kpiAvg">--</div>
      <div class="kpi-label">平均匹配率</div>
      <div class="kpi-sub">黄金路径匹配</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-value" style="color:var(--accent-purple)" id="kpiGrowth">--</div>
      <div class="kpi-label">平均提升</div>
      <div class="kpi-sub">首次→最近练习</div>
    </div>
  </div>

  <!-- Two-column layout -->
  <div class="grid-2">

    <!-- Team Ranking -->
    <div class="panel">
      <h3><span class="ico" style="background:rgba(0,113,227,.08)">🏆</span>团队练习排行</h3>
      <div class="rank-list" id="rankList">
        <div class="empty-state">暂无数据。部署到低代码平台后将自动加载。</div>
      </div>
    </div>

    <!-- Scene Popularity -->
    <div class="panel">
      <h3><span class="ico" style="background:rgba(52,199,89,.08)">🔥</span>场景热度</h3>
      <div class="bar-chart" id="sceneChart">
        <div class="empty-state">暂无数据</div>
      </div>
    </div>

    <!-- Capability Weakness -->
    <div class="panel">
      <h3><span class="ico" style="background:rgba(175,82,222,.08)">📊</span>能力薄弱分布</h3>
      <div class="weakness-grid" id="weaknessGrid">
        <div class="empty-state">暂无数据</div>
      </div>
      <div id="weaknessSummary" style="margin-top:12px;padding:10px 14px;background:rgba(255,149,0,.04);border-radius:10px;font-size:12px;color:var(--text-secondary);line-height:1.6"></div>
    </div>

    <!-- Recent Activity -->
    <div class="panel">
      <h3><span class="ico" style="background:rgba(255,149,0,.08)">📝</span>最近练习</h3>
      <div class="rank-list" id="recentList">
        <div class="empty-state">暂无数据</div>
      </div>
    </div>

  </div>

</div>

<script>
// ===== Load Dashboard Data =====
// In production (低代码平台), this would call:
//   GET /api/coaching/admin/sessions?aggregate=true
// For now, load from localStorage fallback

// ===== Class Management =====
var allRecords = [];
var currentClassId = '';

function initClasses() {
  var classes = [];
  try {
    var raw = localStorage.getItem('mdp_classes');
    if (raw) { classes = JSON.parse(raw); }
  } catch(e) {}

  // Demo data if empty (for testing)
  if (classes.length === 0) {
    classes = [
      { id: 'demo-1', class_name: 'MTP第3期·杭州班', invite_code: 'MTP03HZ', admin_user_id: 'admin1', created_at: '2026-07-15' },
      { id: 'demo-2', class_name: '新经理训练营·宁波班', invite_code: 'NMNINGBO', admin_user_id: 'admin1', created_at: '2026-07-18' }
    ];
    try { localStorage.setItem('mdp_classes', JSON.stringify(classes)); } catch(e) {}
  }

  var sel = document.getElementById('classFilter');
  classes.forEach(function(c) {
    var opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.class_name;
    sel.appendChild(opt);
  });
}

function filterByClass() {
  currentClassId = document.getElementById('classFilter').value;
  var filtered = currentClassId ? allRecords.filter(function(r) { return r.classId === currentClassId; }) : allRecords;

  // Update member count
  if (currentClassId) {
    var members = new Set(filtered.map(function(r) { return r.userId; }));
    document.getElementById('classMemberCount').textContent = members.size + ' 名学员';
  } else {
    document.getElementById('classMemberCount').textContent = '';
  }

  renderDashboard(filtered);
}

(function loadDashboard() {
  var records = [];

  // Load from localStorage (same pattern as 练习记录.html)
  try {
    // Aggregate all sessions from localStorage
    var allKeys = [];
    for (var i = 0; i < localStorage.length; i++) {
      allKeys.push(localStorage.key(i));
    }

    // TG001 sessions
    allKeys.forEach(function(key) {
      if (key.indexOf('tg001_session') === 0 || key === 'tg001_last_session' || key === 'pr2_last_session' || key === 'mdp_sessions') {
        var raw = localStorage.getItem(key);
        if (!raw) return;
        try {
          var data = JSON.parse(raw);
          if (Array.isArray(data)) {
            data.forEach(function(s) { records.push(normalizeSession(s, 'TG-001')); });
          } else if (data && typeof data === 'object') {
            records.push(normalizeSession(data, key.indexOf('pr2') >= 0 ? 'PR-002' : 'TG-001'));
          }
        } catch(e) {}
      }
    });

    // PR2 count-based sessions
    var pr2Count = parseInt(localStorage.getItem('pr2_count') || '0');
    for (var j = 1; j <= pr2Count; j++) {
      var raw = localStorage.getItem('pr2_session_' + j);
      if (raw) {
        try {
          records.push(normalizeSession(JSON.parse(raw), 'PR-002'));
        } catch(e) {}
      }
    }
  } catch(e) {
    console.log('Dashboard load error:', e);
  }

  // Deduplicate
  var seen = {};
  records = records.filter(function(r) {
    var k = (r.userId || 'anon') + '_' + r.timestamp + '_' + r.sceneId;
    if (seen[k]) return false;
    seen[k] = true;
    return true;
  });

  allRecords = records; // Store for class filtering

  if (records.length === 0) {
    showEmptyDashboard();
    return;
  }

  initClasses();
  renderDashboard(records);
})();

function normalizeSession(s, defaultScene) {
  return {
    userId: s.userId || s.user_id || 'demo_user',
    userName: s.userName || s.user_name || '管理者',
    sceneId: s.sceneId || s.scene_id || defaultScene || 'TG-001',
    sceneName: s.sceneName || (s.sceneId === 'PR-002' ? '半年度绩效面谈' : '首开倒计时'),
    timestamp: s.timestamp || s.completed_at || new Date().toISOString(),
    scores: s.scores || s.principles || s.principles_scores || {},
    traps: s.traps || s.antiPatterns || s.anti_patterns || {},
    goldenPathMatch: s.golden_path_match_rate !== undefined ? s.golden_path_match_rate : null
  };
}

function showEmptyDashboard() {
  // Show demo with placeholder structure
  document.getElementById('kpiTotalSub').textContent = '部署低代码平台后自动统计';
  document.getElementById('kpiUsersSub').textContent = '部署低代码平台后自动统计';
}

function renderDashboard(records) {
  // === KPI ===
  document.getElementById('kpiTotal').textContent = records.length;
  var users = new Set(records.map(function(r){ return r.userId; }));
  document.getElementById('kpiUsers').textContent = users.size;
  document.getElementById('kpiTotalSub').textContent = records.length + ' 次练习';
  document.getElementById('kpiUsersSub').textContent = users.size + ' 位学员';

  var matches = records.filter(function(r){ return r.goldenPathMatch !== null; }).map(function(r){ return r.goldenPathMatch; });
  if (matches.length > 0) {
    var avg = Math.round(matches.reduce(function(a,b){ return a+b; }, 0) / matches.length * 100);
    document.getElementById('kpiAvg').textContent = avg + '%';
  }

  // Per-user growth
  var userSessions = {};
  records.forEach(function(r) {
    if (!userSessions[r.userId]) userSessions[r.userId] = [];
    userSessions[r.userId].push(r);
  });
  var growths = [];
  Object.keys(userSessions).forEach(function(uid) {
    var sessions = userSessions[uid];
    if (sessions.length >= 2) {
      var firstScores = getAvgScore(sessions[sessions.length-1].scores);
      var lastScores = getAvgScore(sessions[0].scores);
      growths.push(lastScores - firstScores);
    }
  });
  if (growths.length > 0) {
    var avgGrowth = Math.round(growths.reduce(function(a,b){ return a+b; }, 0) / growths.length);
    document.getElementById('kpiGrowth').textContent = (avgGrowth > 0 ? '+' : '') + avgGrowth + '分';
  }

  // === Team Ranking ===
  var userStats = {};
  records.forEach(function(r) {
    if (!userStats[r.userId]) userStats[r.userId] = { name: r.userName, count: 0, totalScore: 0, lastTime: '' };
    userStats[r.userId].count++;
    var s = getAvgScore(r.scores);
    userStats[r.userId].totalScore += s;
    if (!userStats[r.userId].lastTime || r.timestamp > userStats[r.userId].lastTime) {
      userStats[r.userId].lastTime = r.timestamp;
    }
  });

  var ranking = Object.entries(userStats).sort(function(a,b){ return b[1].count - a[1].count; });
  var rankHtml = '';
  ranking.slice(0, 10).forEach(function(entry, idx) {
    var u = entry[1];
    var numClass = idx === 0 ? 'gold' : (idx === 1 ? 'silver' : (idx === 2 ? 'bronze' : ''));
    var avgScore = Math.round(u.totalScore / u.count);
    var lastDate = new Date(u.lastTime);
    var dateStr = (lastDate.getMonth()+1) + '/' + lastDate.getDate();
    var initial = (u.name || '?').charAt(0);
    rankHtml += '<div class="rank-item">' +
      '<span class="rank-num ' + numClass + '" style="' + (idx > 2 ? 'background:rgba(0,0,0,.04);color:#6e6e73' : '') + '">' + (idx+1) + '</span>' +
      '<span class="rank-avatar">' + initial + '</span>' +
      '<span class="rank-name">' + u.name + '</span>' +
      '<span class="rank-stats"><span>练习 <strong>' + u.count + '</strong> 次</span><span>均分 <strong>' + avgScore + '</strong></span><span>最近 ' + dateStr + '</span></span>' +
    '</div>';
  });
  document.getElementById('rankList').innerHTML = rankHtml || '<div class="empty-state">暂无数据</div>';

  // === Scene Popularity ===
  var sceneCount = {};
  records.forEach(function(r) {
    var name = r.sceneName || r.sceneId;
    sceneCount[name] = (sceneCount[name] || 0) + 1;
  });
  var maxCount = Math.max.apply(null, Object.values(sceneCount));
  var sceneHtml = '';
  var colors = ['blue','green','purple','orange'];
  Object.entries(sceneCount).sort(function(a,b){ return b[1] - a[1]; }).forEach(function(entry, idx) {
    var pct = Math.round(entry[1] / maxCount * 100);
    sceneHtml += '<div class="bar-row">' +
      '<span class="bar-label">' + entry[0] + '</span>' +
      '<span class="bar-track"><span class="bar-fill ' + colors[idx % 4] + '" style="width:' + pct + '%"></span></span>' +
      '<span class="bar-value">' + entry[1] + '</span>' +
    '</div>';
  });
  document.getElementById('sceneChart').innerHTML = sceneHtml || '<div class="empty-state">暂无数据</div>';

  // === Capability Weakness ===
  var allScores = {};
  var scoreCount = {};
  records.forEach(function(r) {
    var s = r.scores || {};
    Object.keys(s).forEach(function(k) {
      if (typeof s[k] === 'number') {
        allScores[k] = (allScores[k] || 0) + s[k];
        scoreCount[k] = (scoreCount[k] || 0) + 1;
      }
    });
  });
  var weaknessHtml = '';
  var dimLabels = { p2_trust: '建立信任', p1_diagnose: '诊断问题', p5_empower: '示范赋能', p3_reframe: '重构目标',
                    trust: '信任', purpose: '目的', encourage: '鼓励', listen: '倾听', end: '结束' };
  Object.keys(allScores).sort(function(a,b){ return (allScores[a]/scoreCount[a]) - (allScores[b]/scoreCount[b]); }).forEach(function(k) {
    var avg = Math.round(allScores[k] / scoreCount[k]);
    var cls = avg >= 70 ? 'color:var(--accent-green)' : (avg >= 40 ? 'color:var(--accent-orange)' : 'color:var(--accent-red)');
    weaknessHtml += '<div class="weakness-card"><div class="weakness-score" style="' + cls + '">' + avg + '</div><div class="weakness-label">' + (dimLabels[k] || k) + '</div></div>';
  });
  document.getElementById('weaknessGrid').innerHTML = weaknessHtml || '<div class="empty-state">暂无数据</div>';

  // Auto-summary for weakest dimension
  var dimEntries = Object.keys(allScores).map(function(k) {
    return { key: k, avg: Math.round(allScores[k] / scoreCount[k]) };
  }).sort(function(a, b) { return a.avg - b.avg; });

  if (dimEntries.length > 0) {
    var weakest = dimEntries[0];
    var weakestLabel = dimLabels[weakest.key] || weakest.key;
    var strongest = dimEntries[dimEntries.length - 1];
    var strongestLabel = dimLabels[strongest.key] || strongest.key;

    var summaryEl = document.getElementById('weaknessSummary');
    if (summaryEl) {
      var gap = strongest.avg - weakest.avg;
      var urgency = gap >= 30 ? '需要重点关注' : (gap >= 15 ? '建议纳入下期培训计划' : '整体较为均衡');
      summaryEl.innerHTML = '🔍 <strong>团队最需要提升的能力是「' + weakestLabel + '」</strong>（均分 ' + weakest.avg + '）。' +
        '最强项「' + strongestLabel + '」（均分 ' + strongest.avg + '），强弱差距 ' + gap + ' 分。' +
        '<span style="color:var(--accent-orange);font-weight:600">' + urgency + '。</span>';
    }
  }

  // === Recent Activity ===
  var recentHtml = '';
  records.slice(0, 8).forEach(function(r) {
    var date = new Date(r.timestamp);
    var dateStr = (date.getMonth()+1) + '/' + date.getDate() + ' ' + String(date.getHours()).padStart(2,'0') + ':' + String(date.getMinutes()).padStart(2,'0');
    var avgScore = getAvgScore(r.scores);
    recentHtml += '<div class="rank-item">' +
      '<span class="rank-avatar">' + (r.userName || '?').charAt(0) + '</span>' +
      '<span class="rank-name">' + r.userName + '</span>' +
      '<span style="font-size:11px;color:var(--text-tertiary)">' + r.sceneName + '</span>' +
      '<span class="rank-stats"><span>' + dateStr + '</span><span>得分 <strong>' + avgScore + '</strong></span></span>' +
    '</div>';
  });
  document.getElementById('recentList').innerHTML = recentHtml || '<div class="empty-state">暂无数据</div>';
}

function getAvgScore(scores) {
  if (!scores) return 0;
  var vals = Object.values(scores).filter(function(v){ return typeof v === 'number'; });
  if (vals.length === 0) return 0;
  return Math.round(vals.reduce(function(a,b){ return a+b; }, 0) / vals.length);
}
</script>

</body>
</html>
