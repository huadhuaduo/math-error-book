<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TG-001 · 对话 · NPC-周</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC','Helvetica Neue',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;
  background:linear-gradient(175deg,#F8F6F2 0%,#EDE8E0 30%,#F5F2ED 60%,#EAE4DC 100%);position:relative;overflow:hidden;
}
/* 环境光 */
.amb{position:fixed;border-radius:50%;filter:blur(110px);pointer-events:none;z-index:0;opacity:.14}
.amb-1{width:340px;height:340px;background:#FEE2E2;top:-80px;right:-60px}
.amb-2{width:260px;height:260px;background:#FEF3C7;bottom:-50px;left:-30px}

/* 🆕 入口动画 — 时钟倒计时+NPC-周剪影 */
.entry-overlay{position:fixed;inset:0;z-index:500;background:linear-gradient(180deg,#1C1917,#2d2a25);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s ease,visibility .8s ease}
.entry-overlay.hide{opacity:0;visibility:hidden}
/* 时钟 */
.entry-clock{width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.15);position:relative;margin-bottom:28px}
.entry-clock::before{content:'';position:absolute;top:50%;left:50%;width:4px;height:4px;background:#D4A574;border-radius:50%;transform:translate(-50%,-50%);z-index:2}
.clock-hand{position:absolute;bottom:50%;left:50%;width:2px;background:#D4A574;transform-origin:bottom center;border-radius:1px;animation:tick 3s linear infinite}
.clock-hand.hour{height:24px;transform:rotate(-60deg)}.clock-hand.minute{height:36px;transform:rotate(30deg)}
@keyframes tick{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.clock-hand.second{height:44px;background:rgba(255,255,255,.4);animation:tick 60s linear infinite}
/* 时钟数字 */
.clock-num{position:absolute;font-size:11px;color:rgba(255,255,255,.35);font-weight:600}
.clock-num:nth-child(1){top:8px;left:50%;transform:translateX(-50%)}.clock-num:nth-child(2){right:8px;top:50%;transform:translateY(-50%)}.clock-num:nth-child(3){bottom:8px;left:50%;transform:translateX(-50%)}.clock-num:nth-child(4){left:8px;top:50%;transform:translateY(-50%)}
/* NPC-周剪影 */
.entry-desk{width:200px;height:70px;position:relative;margin-bottom:24px}
.entry-person{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:50px;height:60px}
.entry-person .head{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,rgba(212,165,116,.4),rgba(184,133,74,.3));margin:0 auto}
.entry-person .body{width:36px;height:32px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border-radius:8px 8px 0 0;margin:0 auto}
.entry-table{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.06);border-radius:2px}
.entry-lamp-glow{position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:80px;height:40px;background:radial-gradient(ellipse,rgba(255,200,120,.15),transparent 70%)}
/* 入口文字 */
.entry-text{color:rgba(255,255,255,.5);font-size:13px;text-align:center;line-height:2;margin-bottom:20px}
.entry-text strong{color:#D4A574;font-size:16px}
.entry-sub{color:rgba(255,255,255,.4);font-size:11px;margin-top:4px}
.entry-btn{padding:12px 40px;border-radius:25px;border:1.5px solid rgba(212,165,116,.3);background:transparent;color:#D4A574;font-size:14px;cursor:pointer;font-family:inherit;letter-spacing:.02em;transition:all .3s;animation:pulse2 2s ease-in-out infinite}
.entry-btn:hover{background:rgba(212,165,116,.1);border-color:#D4A574}
@keyframes pulse2{0%,100%{opacity:.7}50%{opacity:1}}

.app{position:relative;z-index:10;display:flex;max-width:960px;margin:0 auto;height:94vh;padding:16px;gap:14px}

/* 对话区 */
.chat-area{flex:1;display:flex;flex-direction:column;background:rgba(255,255,255,.45);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.5);border-radius:18px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.03)}
.chat-header{padding:12px 18px;background:rgba(255,255,255,.4);border-bottom:1px solid rgba(0,0,0,.04);display:flex;align-items:center;gap:10px}
.npc-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#D4A574,#B8854A);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;flex-shrink:0;box-shadow:0 2px 8px rgba(180,130,70,.2)}
.npc-name{font-size:14px;font-weight:600;color:#1C1917}
.npc-mood{font-size:11px;color:#B8854A;transition:color .5s}

.msg-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}

/* 用户消息 */
.msg{max-width:82%;animation:msgIn .3s ease}@keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end}
.msg.user .msg-bubble{background:#1C1917;color:#fff;border-bottom-right-radius:4px;font-weight:500;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.55}
.msg.npc .msg-bubble{background:#fff;border:1px solid rgba(0,0,0,.06);color:#1C1917;border-bottom-left-radius:4px;font-weight:400;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.55}

/* NPC消息 — 动作+语言分层 */
.npc-msg-block{max-width:82%;min-width:60px;align-self:flex-start;margin-bottom:8px;animation:msgIn .3s ease}
.npc-action{font-size:10px;color:#B8854A;font-style:italic;line-height:1.5;padding:0 0 4px 4px}
.npc-dialogue{background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.6;color:#1C1917;border-bottom-left-radius:4px;font-weight:400;display:block;word-break:break-word}

/* 🆕 提醒栏 — 插入消息流 */
.whisper-inline{align-self:stretch;margin:2px 0 8px;padding:6px 10px 6px 12px;border:none;border-radius:0 8px 8px 0;font-size:10px;line-height:1.5;display:flex;align-items:flex-start;gap:6px;font-style:italic}
.whisper-inline.info{background:rgba(239,246,255,.35);border-left:2px solid #3B82F6;color:#2563eb}
.whisper-inline.warn{background:rgba(254,243,199,.25);border-left:2px solid #D97706;color:#92400E}
.whisper-inline.praise{background:rgba(220,252,231,.3);border-left:2px solid #16a34a;color:#166534}

/* 输入区 */
.chat-input-area{padding:10px 14px;background:rgba(255,255,255,.4);border-top:1px solid rgba(0,0,0,.04);display:flex;gap:8px;align-items:flex-end}
.chat-input{flex:1;border:1px solid rgba(0,0,0,.06);border-radius:12px;padding:10px 14px;font-size:13px;font-family:inherit;resize:none;outline:none;background:rgba(255,255,255,.5);line-height:1.5;color:#1C1917}
.chat-input:focus{border-color:#D4A574;box-shadow:0 0 0 3px rgba(212,165,116,.06)}
.chat-input::placeholder{color:#A8A29E}
.send-btn,.voice-btn{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:14px}
.send-btn{background:#1C1917;color:#fff}.send-btn:hover{background:#B8854A}.send-btn:disabled{opacity:.3;cursor:not-allowed}
.voice-btn{background:rgba(0,0,0,.03);color:#78716C;font-size:16px}.voice-btn:hover{background:rgba(0,0,0,.06)}.voice-btn.active{background:rgba(239,68,68,.1);color:#DC2626;animation:pulse .8s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* 暂停遮罩 */
.pause-overlay{display:none;position:absolute;inset:0;background:rgba(28,25,23,.5);z-index:50;align-items:center;justify-content:center;border-radius:18px}
.pause-overlay.show{display:flex}
.pause-box{background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-radius:16px;padding:28px 24px;max-width:380px;width:90%;box-shadow:0 12px 40px rgba(0,0,0,.1)}
.pause-box h3{font-size:15px;font-weight:700;color:#1C1917;margin-bottom:6px}
.pause-box .last-npc{font-size:11px;color:#78716C;font-style:italic;padding:8px 12px;background:rgba(0,0,0,.02);border-radius:8px;margin-bottom:16px;line-height:1.6}
.pause-q{font-size:12px;color:#44403C;line-height:1.7;margin-bottom:6px;padding-left:14px;border-left:2px solid #D4A574}
.pause-btns{display:flex;gap:8px;margin-top:16px}
.pause-btns button{flex:1;padding:10px;border:none;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.pause-continue{background:rgba(212,165,116,.12);color:#B8854A}.pause-continue:hover{background:rgba(212,165,116,.2)}
.pause-retry{background:rgba(0,0,0,.03);color:#78716C}.pause-retry:hover{background:rgba(0,0,0,.06)}

/* 侧边栏 */
.side-panel{width:195px;background:rgba(255,255,255,.4);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.5);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.03)}
.side-card{background:rgba(255,255,255,.5);border-radius:10px;border:1px solid rgba(0,0,0,.03);padding:10px}
.side-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#A8A29E;margin-bottom:4px}
.side-text{font-size:10px;color:#44403C;line-height:1.5}
.health-bar{height:4px;border-radius:2px;background:rgba(0,0,0,.05);margin-top:6px;overflow:hidden}
.health-fill{height:100%;border-radius:2px;transition:width .7s ease}
.side-btn{font-size:10px;cursor:pointer;text-align:center;padding:6px;border-radius:8px;border:1px solid rgba(0,0,0,.06);background:rgba(0,0,0,.02);font-family:inherit;transition:all .2s;width:100%;color:#A8A29E}
.side-btn:hover{background:rgba(0,0,0,.05);color:#1C1917}
.side-btn.primary{background:#1C1917;color:#fff;border:none;font-weight:600;margin-top:auto}
.side-btn.primary:hover{background:#B8854A}
.mood-change{font-size:10px;color:#B8854A;padding:2px 0;text-align:center;animation:fadeIn .5s}@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* 聚焦弹窗 */
.focus-overlay{display:none;position:fixed;inset:0;background:rgba(28,25,23,.6);z-index:200;align-items:center;justify-content:center}
.focus-overlay.show{display:flex}
.focus-box{background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-radius:16px;padding:28px 24px;max-width:380px;width:90vw;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.1)}
.focus-box h3{font-size:15px;color:#1C1917;margin-bottom:4px}
.focus-box .sub{font-size:11px;color:#A8A29E;margin-bottom:16px}
.focus-option{padding:10px 14px;margin:6px 0;border:1px solid rgba(0,0,0,.08);border-radius:10px;cursor:pointer;font-size:12px;text-align:left;transition:all .15s;color:#44403C;background:#fff}
.focus-option:hover{border-color:#D4A574;background:rgba(212,165,116,.04)}
.focus-option.sel{border-color:#B8854A;background:rgba(212,165,116,.08);font-weight:600;color:#B8854A}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(28,25,23,.92);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:500;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
@media(max-width:700px){.side-panel{display:none}.app{padding:10px;height:96vh}.msg{max-width:88%}.npc-msg-block{max-width:90%}}
</style>
</head>
<body>

<!-- 🆕 入口动画 — 时钟+NPC-周剪影+倒计时 -->
<div class="entry-overlay" id="entryOverlay">
  <div class="entry-clock">
    <span class="clock-num">20</span><span class="clock-num">5</span><span class="clock-num">10</span><span class="clock-num">15</span>
    <div class="clock-hand hour"></div>
    <div class="clock-hand minute"></div>
    <div class="clock-hand second"></div>
  </div>
  <div class="entry-desk">
    <div class="entry-lamp-glow"></div>
    <div class="entry-person"><div class="head"></div><div class="body"></div></div>
    <div class="entry-table"></div>
  </div>
  <div class="entry-text">
    首开倒计时<strong>20天</strong><br>
    晚上8点 · 售楼处临时工位<br>
    <div class="entry-sub">NPC-周还没走。他在等你开口。</div>
  </div>
  <!-- 🆕 NPC-周的心声 — hiddenMotivation -->
  <div style="color:rgba(255,255,255,.4);font-size:11px;font-style:italic;text-align:center;max-width:280px;line-height:1.7;margin-bottom:20px">
    "这个户型我卖了五年。<br>你一个空降的——先让我看看你几斤几两。<br>我不反对你。但你要值得我跟。"
  </div>
  <button class="entry-btn" onclick="enterChat()">进入对话</button>
</div>

<div class="amb amb-1"></div><div class="amb amb-2"></div>

<div class="app">
  <div class="chat-area" style="position:relative">
    <div class="chat-header"><div class="npc-av">周</div><span class="npc-name">NPC-周</span><span class="npc-mood" id="moodLabel">在观望</span></div>
    <div class="msg-list" id="msgList"></div>
    <div class="chat-input-area">
      <textarea class="chat-input" rows="2" placeholder="输入你的回应..." id="chatInput"></textarea>
      <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()" title="语音输入">🎤</button>
      <button class="send-btn" onclick="sendMsg()" id="sendBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22,2 15,22 11,13 2,9"/></svg>
      </button>
    </div>
    <div class="pause-overlay" id="pauseOverlay"><div class="pause-box"><h3>⏸ 暂停一下</h3><div class="last-npc" id="pauseLastNpc"></div><div class="pause-q" id="pauseQ1"></div><div class="pause-q" id="pauseQ2"></div><div class="pause-q" id="pauseQ3"></div><div class="pause-btns"><button class="pause-continue" onclick="resumeChat()">继续对话</button><button class="pause-retry" onclick="resumeChat()">换个方式试试</button></div></div></div>
  </div>

  <div class="side-panel">
    <div class="side-card"><div class="side-label">本次聚焦</div><div class="side-text" id="sideFocus" style="color:#B8854A;font-weight:600">—</div></div>
    <div class="side-card"><div class="side-label">NPC-周现在</div><div class="side-text" id="sideState">在观望。他见过太多空降领导——先看你是真有本事还是只会画饼。</div><div id="moodChangeHint"></div></div>
    <div class="side-card"><div class="side-label">对话健康度</div><div class="health-bar"><div class="health-fill" id="healthFill" style="width:30%;background:linear-gradient(90deg,#B8854A,#D4A574)"></div></div><div class="side-text" id="healthLabel" style="margin-top:4px;font-size:9px;color:#B8854A">刚开始，NPC-周还在看你</div></div>
    <button class="side-btn" onclick="pauseChat()">⏸ 暂停，我想想</button>
    <button class="side-btn primary" onclick="endConversation()">结束对话，查看反馈 →</button>
  </div>
</div>

<div class="focus-overlay" id="focusOverlay"><div class="focus-box"><h3>这次对话，你最想练什么？</h3><div class="sub">选一个——NPC-周会在这个维度上特别考验你</div>
    <div class="focus-option sel" onclick="selectFocus(0,this)" data-focus="先做事，不说话">先做事，不说话——建立信任</div>
    <div class="focus-option" onclick="selectFocus(1,this)" data-focus="先问'你觉得呢'">先问"你觉得呢"——诊断问题</div>
    <div class="focus-option" onclick="selectFocus(2,this)" data-focus="替团队做减法">替团队做减法——不做对比表</div>
    <div class="focus-option" onclick="selectFocus(3,this)" data-focus="亲自做给他们看">亲自做给他们看——打样示范</div>
    <button onclick="selectFocusAndStart()" style="margin-top:14px;width:100%;padding:12px;border:none;border-radius:12px;background:#1C1917;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">开始对话</button>
  </div></div>
<div id="toast"></div>

<script>
var round=0,healthScore=30,moodState='WATCH',focusIndex=0,lastNpcMsg='',lastNpcAction='';
var focusLabels=['先做事，不说话','先问"你觉得呢"','替团队做减法','亲自做给他们看'];
var lastSubstantiveRound=0,positiveBehaviors=[],voiceActive=false,recognition=null;

// 🆕 入口动画 — 点击进入
function enterChat(){
  document.getElementById('entryOverlay').classList.add('hide');
  document.getElementById('focusOverlay').classList.add('show');
}

function selectFocus(i,el){focusIndex=i;document.querySelectorAll('.focus-option').forEach(function(e){e.classList.remove('sel')});el.classList.add('sel')}

function selectFocusAndStart(){
  document.getElementById('focusOverlay').classList.remove('show');
  document.getElementById('sideFocus').textContent=focusLabels[focusIndex];
  updateSidebar();
  showWhisperInline('info','💡 聚焦：<strong>'+focusLabels[focusIndex]+'</strong>。NPC-周在等你开口——你在他面前的第一句话，直接决定他把你归为哪类人。');
}

function showToast(m,d){d=d||2000;var t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';clearTimeout(t._timer);t._timer=setTimeout(function(){t.style.opacity='0'},d);}
function showWhisperInline(type,msg){var ml=document.getElementById('msgList');var d=document.createElement('div');d.className='whisper-inline '+type;d.innerHTML='<span style="flex-shrink:0;margin-top:1px">'+(type==='warn'?'⚠️':type==='praise'?'👍':'💡')+'</span><span>'+msg+'</span>';ml.appendChild(d);ml.scrollTop=ml.scrollHeight;}
function escHtml(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function renderNpcMsg(action,dialogue){var ml=document.getElementById('msgList');if(!ml)return;var wrap=document.createElement('div');wrap.className='msg npc';var bubble=document.createElement('div');bubble.className='msg-bubble';bubble.style.cssText='background:#fff;color:#1C1917;padding:10px 14px;border-radius:12px;font-size:13px;border:1px solid #ddd';var h='';if(action)h+='<span style="display:block;font-size:10px;color:#B8854A;font-style:italic;margin-bottom:4px">'+action+'</span>';h+='<span>'+dialogue+'</span>';bubble.innerHTML=h;wrap.appendChild(bubble);ml.appendChild(wrap);ml.scrollTop=ml.scrollHeight;}

function updateSidebar(){
  var moods={WATCH:{label:'在观望',dot:'#B8854A',desc:'在观望。见过太多空降领导——先看你是真有本事还是只会画饼。'},TEST:{label:'在试探',dot:'#3B82F6',desc:'在试探。你展示了一点东西——他拿客户来试你。'},VERIFY:{label:'在验证',dot:'#16a34a',desc:'在验证。方向有了——他在等证据。'},FOLLOW:{label:'开始跟从',dot:'#D97706',desc:'开始跟从。他主动找你——这不是服从，是认可。'}};
  var m=moods[moodState];
  document.getElementById('moodLabel').textContent=m.label;document.getElementById('moodLabel').style.color=m.dot;
  document.getElementById('sideState').textContent=m.desc;
  var h=Math.min(100,Math.max(5,healthScore));document.getElementById('healthFill').style.width=h+'%';
  var c,l;if(h>=70){c='#16a34a';l='NPC-周愿意跟着你走了';}else if(h>=45){c='#D97706';l='NPC-周开始认真对待你了';}else{c='#B8854A';l='NPC-周还在观察你';}
  document.getElementById('healthFill').style.background='linear-gradient(90deg,'+c+','+(h>=70?'#22c55e':h>=45?'#F59E0B':'#D4A574')+')';
  document.getElementById('healthLabel').textContent=l;document.getElementById('healthLabel').style.color=c;
}
function setMood(n){if(n!==moodState){var lb={WATCH:'在观望',TEST:'在试探',VERIFY:'在验证',FOLLOW:'开始跟从'};document.getElementById('moodChangeHint').innerHTML='<div class="mood-change">↑ NPC-周从"'+lb[moodState]+'"→"'+lb[n]+'"</div>';setTimeout(function(){document.getElementById('moodChangeHint').innerHTML='';},4000);moodState=n;}}

// 🆕 language_profile 过滤——NPC-周不能说 avoid 词汇
function filterResponse(dialogue){
  var p=LAOZHOU_PROFILE;var d=dialogue;
  for(var i=0;i<p.avoid.length;i++){
    var w=p.avoid[i];var re=new RegExp(w,'g');
    if(re.test(d)){d=d.replace(re,p.use[i%p.use.length]||'这个');}
  }
  return d;
}

// 🆕 聚焦联动——根据focusIndex调整陷阱检测灵敏度
function getFocusSensitivity(){
  // focusIndex: 0=先做事不说话 1=先问后说 2=做减法 3=打样
  if(focusIndex===2) return {traps:['T03','T04'], penalty:1.5, earlyWarn:true}; // 做减法→T03/T04加倍敏感
  if(focusIndex===3) return {traps:['T04','T05'], penalty:1.5, earlyWarn:true}; // 打样→T04/T05加倍敏感
  if(focusIndex===0) return {traps:['T01','T06'], penalty:1.3, earlyWarn:false}; // 信任→T01/T06敏感
  return {traps:[], penalty:1, earlyWarn:false};
}

function detectStuck(text){if(round-lastSubstantiveRound>=2&&text.length<12){showWhisperInline('info','💡 连续两轮没有推进。试试问NPC-周："你觉得这两个户型，哪个值得主推？"');lastSubstantiveRound=round;return true;}if(text.length>=12)lastSubstantiveRound=round;return false;}
function detectPositive(text){if(/你.*觉得|你.*怎么看|你帮我|你觉得.*呢/.test(text)&&moodState==='WATCH'){showWhisperInline('praise','👍 你问了NPC-周的看法——不是直接宣布策略。他注意到了。');positiveBehaviors.push('先问后说');}if(/数据|户型|采光|爬楼|说辞|竞品/.test(text)&&moodState==='WATCH'&&round<=2){showWhisperInline('praise','👍 你没开会——先展示了业务能力。NPC-周见过的前四任都是先画饼。');positiveBehaviors.push('先做事');}if(/聚焦|砍掉|主力|只推|两个|做.*减法|就推/.test(text)&&moodState==='TEST'){showWhisperInline('praise','👍 你替团队做了减法——直接砍到两个。NPC-周心里那句"终于有人敢砍了"。');positiveBehaviors.push('做减法');}}

// 🆕 语音 — 可开关，interimResults
function toggleVoice(){var btn=document.getElementById('voiceBtn');if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){showToast('浏览器不支持语音输入。低代码平台部署后可通过插件实现。');return;}if(voiceActive){stopVoice();return;}var SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.lang='zh-CN';recognition.interimResults=true;recognition.continuous=false;recognition.onstart=function(){voiceActive=true;btn.classList.add('active');btn.textContent='🔴';};recognition.onend=function(){voiceActive=false;btn.classList.remove('active');btn.textContent='🎤';};recognition.onresult=function(e){var t='';for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;document.getElementById('chatInput').value=t;};recognition.onerror=function(e){voiceActive=false;btn.classList.remove('active');btn.textContent='🎤';showToast('识别失败，请重试');};recognition.start();}
function stopVoice(){if(recognition){recognition.stop();recognition=null;}voiceActive=false;document.getElementById('voiceBtn').classList.remove('active');document.getElementById('voiceBtn').textContent='🎤';}

function sendMsg(){
  var input=document.getElementById('chatInput');var text=input.value.trim();if(!text)return;input.value='';input.focus();round++;
  var ml=document.getElementById('msgList');var ud=document.createElement('div');ud.className='msg user';ud.innerHTML='<div class="msg-bubble">'+escHtml(text)+'</div>';ml.appendChild(ud);ml.scrollTop=ml.scrollHeight;
  detectStuck(text);
  var action='',dialogue='';
  // NPC-周回应 — 严格遵循 language_profile: 短句、不用管理词、观望时冷淡、被问时松动
  if(/数据|客户.*情况|怎么.*样|示范区|来访/.test(text)&&round<=2){healthScore+=8;setMood('TEST');action='NPC-周抬起头——今天第一次正眼看你。';dialogue='"你看完数据了？那你觉得——这几个户型，哪个好卖？"不是问你意见。是考你。';}
  else if(/你.*帮|你.*觉得|怎么.*看|有.*想法|你比我|你.*经验/.test(text)&&round<=4){healthScore+=12;setMood('VERIFY');action='NPC-周把保温杯往桌上一搁。声音压低了。';dialogue='"实话跟你说——6个户型，哪个都说好。客户比来比去，我们也比来比去。不是不卖力。是没人敢说\'就推这两个\'。"';}
  else if(/聚焦|砍掉|主力|两个|做.*减法|就推|只推|重点/.test(text)&&round<=6){healthScore+=15;setMood('FOLLOW');action='NPC-周沉默了几秒。然后他点了头——不是客气那种。';dialogue='"砍到2个。我五年前就想这么干了。没人敢拍板。"他停了一下。"但领导——光说不行。你得让他们看见。"';showWhisperInline('info','💡 方向有了——差最后一步：让他亲眼看到你做成一单。');}
  else if(/我来|亲自|我去|做.*一单|打样|蹲.*沙盘|促成/.test(text)){healthScore+=20;action='NPC-周站起来——不是客气的站，是"这事定了"的站。';dialogue='"实话跟你说——你来那天，我以为又是一个。前四个都是。"他顿了一下。"你不是。这批人现在听你的。不是因为你上头派来的。你做了我们半年没做成的事。"';showWhisperInline('praise','👍 亲自打了样。NPC-周从"试试看"变成"跟着做"。');}
  else if(round<=3){action='NPC-周眼皮都没抬。保温杯端起来喝了一口。';dialogue='"嗯。"不是不礼貌——还没看到值得他抬头的。';}
  else{healthScore+=3;action='NPC-周看了你一眼。没说话。';dialogue='"你说——"他在等。等你问出那句让他觉得不一样的话。';}
  // 🆕 language_profile 过滤
  try{dialogue=filterResponse(dialogue);}catch(e){}
  lastNpcAction=action;lastNpcMsg=dialogue;
  // 🆕 聚焦联动——做减法/打样维度陷阱检测更敏感
  var sens=getFocusSensitivity();
  if(sens.earlyWarn&&sens.traps.indexOf('T03')>=0&&/对比表|培训|教.*方法|表格.*分析/.test(text)){healthScore-=Math.round(8*sens.penalty);showWhisperInline('warn','⚠️ 你这次聚焦"'+focusLabels[focusIndex]+'"——但刚才你给了工具/培训。这正是T03/T04陷阱。换个方式：直接说"就推这两个"。');}
  healthScore=Math.min(100,Math.max(5,healthScore));detectPositive(text);
  try{renderNpcMsg(action,dialogue);}catch(e){console.error(e);}
  try{updateSidebar();}catch(e){}
  if(healthScore>=65)try{document.querySelector('.side-btn.primary').textContent='查看反馈报告 →';}catch(e){}
}

function pauseChat(){
  var q1='NPC-周刚才说了什么？你的回应是在推进，还是在绕圈子？',q2='如果换一种回应——他会怎么反应？',q3='你这次想练的是'+focusLabels[focusIndex]+'——刚才那一步做到了吗？';
  if(moodState==='WATCH'){q1='NPC-周还在观望——你刚才的话让他多了信任还是少了？';q2='前四任空降都先开会。你有没有做跟他们一样的事？';}
  else if(moodState==='TEST'){q1='NPC-周在试探——他拿客户来考你。接住了吗？';q2='他是真需要你的建议，还是在看你有多少斤两？';}
  else if(moodState==='VERIFY'){q1='方向定了，但NPC-周在等证据。你给他了吗？';q2='他知道方向对了——但他不知道跟着你能不能成。';}
  // 🆕 "试试这样说"——基于当前状态给具体回应模板
  var tips={WATCH:'"NPC-周，我翻完数据了。B和D在12楼以上——视野最好。你在这五年了。你说呢？"',TEST:'"你帮我看看这个客户。他一直在对比B和D。你卖了五年——你比我清楚。"',VERIFY:'"就推B和D。别的先放一放。明天下午我蹲沙盘——带一组客户给你看。"',FOLLOW:'"你手上那组客户——我们一起去。我谈，你看着。"'};
  document.getElementById('pauseLastNpc').textContent=lastNpcAction+' '+lastNpcMsg.replace(/<[^>]*>/g,'').slice(0,60)+'…';
  document.getElementById('pauseQ1').textContent='1. '+q1;document.getElementById('pauseQ2').textContent='2. '+q2;document.getElementById('pauseQ3').textContent='3. '+q3;
  document.getElementById('pauseQ3').insertAdjacentHTML('afterend','<div style="font-size:11px;color:#B8854A;padding:6px 10px;background:rgba(212,165,116,.06);border-radius:8px;margin-top:8px;line-height:1.5">💬 试试这样说：'+tips[moodState]+'</div>');
  document.getElementById('pauseOverlay').classList.add('show');document.getElementById('chatInput').disabled=true;document.getElementById('sendBtn').disabled=true;
}
function resumeChat(){document.getElementById('pauseOverlay').classList.remove('show');document.getElementById('chatInput').disabled=false;document.getElementById('sendBtn').disabled=false;document.getElementById('chatInput').focus();}
function endConversation(){
  var selfScore=prompt('在查看反馈之前——你觉得刚才这场对话，做得怎么样？（1-10分）','');
  if(selfScore!==null){try{localStorage.setItem('tg001_post_eval',JSON.stringify({score:parseInt(selfScore)||0,timestamp:new Date().toISOString(),focus:focusLabels[focusIndex],mood:moodState,health:healthScore,positiveBehaviors:positiveBehaviors}));}catch(e){}}
  // 三智能体串联：跳转反馈页
  window.location.href='TG001_反馈页.html';
}
(function(){document.getElementById('chatInput').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});})();
</script>
