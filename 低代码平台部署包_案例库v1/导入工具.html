<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>案例库导入工具</title>
<style>
body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f8f9fb; }
h2 { color: #1a2a3a; }
.card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 20px; margin: 12px 0; }
input[type=file] { margin: 8px 0; }
button { padding: 10px 24px; background: #1a2a3a; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; margin: 4px; }
button:disabled { background: #999; }
.status { font-size: 12px; margin-top: 6px; }
.ok { color: #2d8a56; }
.err { color: #c44; }
</style>
</head>
<body>

<h2>案例库导入工具</h2>
<p style="color:#6b7280;font-size:13px;">步骤：在低代码平台页面登录后 → 打开浏览器控制台 → 粘贴下方代码 → 然后回到本页面点"导入"</p>

<div class="card">
  <h3>Step 1：在低代码平台控制台执行这段（先复制）</h3>
  <textarea id="setupCode" readonly style="width:100%;height:60px;font-family:monospace;font-size:11px;">window.__SEED_CARDS = []; window.__SEED_DONE = function(c) { window.__SEED_CARDS.push(c); console.log('✅', c.meta.title); return window.__SEED_CARDS.length; };</textarea>
  <p style="font-size:11px;color:#d97706;">复制 → 打开低代码平台任意页面 → F12 → Console → 粘贴 → 回车</p>
</div>

<div class="card">
  <h3>Step 2：逐个导入 JSON 文件</h3>
  <p style="font-size:12px;color:#6b7280;">选择 case-library 文件夹里的 JSON 文件，一次一个</p>
  <input type="file" id="fileInput" accept=".json" style="display:block;margin:10px 0;">
  <div class="status" id="status"></div>
</div>

<div class="card">
  <h3>Step 3：全部入库</h3>
  <p style="font-size:12px;color:#6b7280;">4 张卡都加载后，复制下方代码到低代码平台控制台执行</p>
  <textarea id="runCode" readonly style="width:100%;height:100px;font-family:monospace;font-size:11px;"></textarea>
  <button id="btnGenerate" disabled>生成入库脚本</button>
</div>

<script>
var loadedCards = [];
var loadCount = 0;

document.getElementById('fileInput').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var card = JSON.parse(ev.target.result);
      loadedCards.push(card);
      loadCount++;
      document.getElementById('status').innerHTML =
        '<span class="ok">✅ 已加载 ' + loadCount + ' 张：' + card.meta.title + '</span>';

      if (loadCount >= 4) {
        document.getElementById('btnGenerate').disabled = false;
      }
      document.getElementById('fileInput').value = '';
    } catch(err) {
      document.getElementById('status').innerHTML = '<span class="err">❌ JSON 解析失败：' + err.message + '</span>';
    }
  };
  reader.readAsText(file);
});

document.getElementById('btnGenerate').addEventListener('click', function() {
  var code = 'var cards = ' + JSON.stringify(loadedCards) + ';\n\n';
  code += 'for (var c of cards) {\n';
  code += '  var resp = await axiosForBackend.post("/api/coaching/scenario-cards", {\n';
  code += '    scenarioCard: c, dVector: c.meta.d_vector,\n';
  code += '    pSequence: c.meta.p_sequence, progressionChain: c.meta.progression_chain, title: c.meta.title\n';
  code += '  });\n';
  code += '  console.log("✅ " + c.meta.title + " → " + resp.data.id);\n';
  code += '}\n';
  code += 'console.log("🎉 4张场景卡全部导入完成！访问 /scenario/generate 查看");';

  document.getElementById('runCode').value = code;
});
</script>

</body>
</html>
