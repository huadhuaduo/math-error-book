<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="数学错题本">
<meta name="theme-color" content="#f5f5f7">
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoi5pWw5a2m6ZSZ6aKY5pysIiwiZGlzcGxheSI6InN0YW5kYWxvbmUifQ==">
<title>数学错题本 · 六年级</title>
<style>
:root{
  --blue:#0071e3;--green:#34c759;--red:#ff3b30;--orange:#ff9500;
  --bg:#f5f5f7;--card:rgba(255,255,255,0.72);--card-solid:#fff;
  --text:#1d1d1f;--text2:#6e6e73;--text3:#86868b;
  --border:rgba(0,0,0,0.08);--shadow:0 4px 16px rgba(0,0,0,0.06);
  --radius:16px;--radius-sm:10px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{
  font-family:var(--font);color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;overflow:hidden;height:100dvh;
}
input,textarea,button{font-family:inherit;font-size:16px}
input[type="text"],textarea{
  width:100%;padding:12px 14px;border:1px solid #d2d2d7;border-radius:var(--radius-sm);
  background:var(--card-solid);outline:none;transition:border .15s;
}
input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,0.1)}
textarea{resize:vertical;min-height:72px;line-height:1.5}
button{
  border:none;cursor:pointer;font-weight:500;border-radius:20px;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  min-height:44px;transition:all .15s;padding:10px 20px;font-size:15px;
}
button:active{transform:scale(.97)}
button.primary{background:var(--blue);color:#fff}
button.outline{background:rgba(0,0,0,0.04);color:var(--text)}
button.danger{background:var(--red);color:#fff}
button.sm{padding:6px 14px;font-size:13px;min-height:36px}
button.lg{padding:14px 28px;font-size:17px}
button.block{width:100%}
button:disabled{opacity:.4;pointer-events:none}

.amb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;opacity:.5}
.amb1{width:300px;height:300px;background:radial-gradient(circle,rgba(0,113,227,.12),transparent 70%);top:-80px;right:-60px}
.amb2{width:250px;height:250px;background:radial-gradient(circle,rgba(52,199,89,.08),transparent 70%);bottom:20%;left:-80px}

nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(255,255,255,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);display:flex;justify-content:space-around;
  padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));
}
nav a{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 12px;border-radius:var(--radius-sm);text-decoration:none;
  color:var(--text3);font-size:11px;font-weight:500;min-width:48px;min-height:44px;justify-content:center;
}
nav a.active{color:var(--blue)}
nav a svg{width:22px;height:22px}

.screen{
  position:fixed;top:0;left:0;right:0;bottom:0;z-index:10;
  overflow-y:auto;padding:20px 16px;padding-bottom:90px;
  display:none;-webkit-overflow-scrolling:touch;
}
.screen.active{display:block}
h2{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:16px}
h3{font-size:17px;font-weight:600;margin-bottom:8px}

.card{
  background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:var(--radius);padding:16px;border:1px solid var(--border);box-shadow:var(--shadow);
  margin-bottom:10px;
}

.tag{
  display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:500;
  background:rgba(0,113,227,0.08);color:var(--blue);margin:2px 4px 2px 0;
}
.tag.red{background:rgba(255,59,48,0.08);color:var(--red)}
.tag.green{background:rgba(52,199,89,0.08);color:var(--green)}
.tag.gray{background:rgba(0,0,0,0.05);color:var(--text3)}

#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none}
.toast{
  background:var(--text);color:#fff;padding:10px 20px;border-radius:20px;
  font-size:14px;font-weight:500;margin-bottom:6px;
  animation:in .3s ease,out .3s ease 2s forwards;
  box-shadow:0 8px 24px rgba(0,0,0,0.15);text-align:center;
}
.toast.ok{background:var(--green)}
.toast.err{background:var(--red)}
@keyframes in{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes out{from{opacity:1}to{opacity:0}}

.bar{height:6px;background:rgba(0,0,0,0.06);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .5s}
.bar-fill.r{background:var(--red)}.bar-fill.o{background:var(--orange)}.bar-fill.g{background:var(--green)}.bar-fill.b{background:var(--blue)}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

@media print{
  body{background:#fff!important;overflow:visible!important}
  nav,.amb,#toast,button{display:none!important}
  .screen{position:static!important;display:block!important;overflow:visible!important;padding:0!important}
  .screen:not(.pt){display:none!important}
  .pp{padding:12mm;page-break-after:always}
  .pp h2{font-size:18pt;margin-bottom:12pt}
  .pq{border:1px solid #ccc;border-radius:4px;padding:10px;margin-bottom:6px;page-break-inside:avoid}
  .pq .ans{width:100%;height:36px;border-bottom:2px solid #000;margin:8px 0}
}

@media(min-width:768px){
  nav{top:0;bottom:auto;padding:0 20px;height:52px;align-items:center;justify-content:flex-start;gap:0}
  nav a{flex-direction:row;font-size:14px;gap:6px;padding:8px 16px}
  nav a svg{width:18px;height:18px}
  body{padding-top:52px}
  .screen{top:52px}
}
@media(min-width:1024px){.screen{max-width:720px;margin:0 auto}}
</style>
</head>
<body>

<div class="amb amb1"></div><div class="amb amb2"></div>
<div id="toast"></div>

<!-- ============ SCREEN: ADD (简单化) ============ -->
<div class="screen active" id="sc-add">
  <h2>添加错题</h2>

  <div class="card" style="text-align:center">
    <input type="file" accept="image/*" capture="environment" id="cam" style="display:none" onchange="A.handlePhoto(event)">
    <input type="file" accept="image/*" id="gal" style="display:none" onchange="A.handlePhoto(event)">
    <div id="photo-empty">
      <div style="font-size:40px;margin-bottom:4px">📷</div>
      <button class="primary lg" onclick="document.getElementById('cam').click()">拍照上传错题</button>
      <button class="outline" style="margin-left:6px" onclick="document.getElementById('gal').click()">从相册选</button>
    </div>
    <div id="photo-preview" style="display:none">
      <img id="photo-img" style="max-height:200px;margin:0 auto;border-radius:var(--radius-sm)">
      <div style="margin-top:10px;display:flex;gap:6px;justify-content:center">
        <button class="primary sm" onclick="A.doOCR()" id="btn-ocr">🔍 识别文字</button>
        <button class="outline sm" onclick="A.clearPhoto()">✕ 清除</button>
      </div>
      <div id="ocr-msg" style="margin-top:6px;font-size:12px;color:var(--text2)"></div>
    </div>
  </div>

  <div style="margin-bottom:8px">
    <textarea id="prob-text" placeholder="题目内容（拍照自动识别，或直接粘贴文字）" oninput="A.onTextChange()"></textarea>
  </div>

  <div id="tags-bar" style="margin-bottom:8px;font-size:12px;min-height:20px">
    <span style="color:var(--text3)">拍照或输入文字后自动识别知识点</span>
  </div>

  <div style="margin-bottom:12px">
    <input type="text" id="prob-ans" placeholder="正确答案（必填）">
  </div>

  <button class="primary block lg" onclick="A.save()">💾 保存错题</button>
  <div id="save-msg" style="text-align:center;margin-top:8px;font-size:13px"></div>

  <div style="margin-top:24px;padding-top:16px;border-top:1px solid var(--border)">
    <div style="font-size:13px;color:var(--blue);cursor:pointer;margin-bottom:8px" onclick="var e=document.getElementById('batch');e.style.display=e.style.display==='none'?'block':'none'">📋 批量导入（粘贴整段文字，自动拆题）</div>
    <div id="batch" style="display:none">
      <textarea id="batch-text" placeholder="粘贴整段错题（按编号1. 2. 3.或空行分隔）" style="min-height:100px"></textarea>
      <button class="outline block" style="margin-top:8px" onclick="A.splitBatch()">🔍 智能拆分</button>
      <div id="batch-out"></div>
    </div>
  </div>
</div>

<!-- ============ SCREEN: ANALYZE (深入化) ============ -->
<div class="screen" id="sc-analyze">
  <h2>薄弱点分析</h2>
  <div class="card" id="hero" style="border-left:4px solid var(--red)"></div>
  <div class="card" id="score-prediction" style="background:rgba(0,113,227,0.03);border:1px solid rgba(0,113,227,0.2)"></div>
  <div class="card" style="text-align:center">
    <h3>掌握度雷达图</h3>
    <div id="radar"></div>
  </div>
  <div class="card"><h3>知识点掌握度</h3><div id="topics"></div></div>
  <div class="card"><h3>错因分析</h3><div id="patterns"></div></div>
  <div class="card"><h3>进步趋势</h3><div id="trend"></div></div>
</div>

<!-- ============ SCREEN: PRACTICE (有用化) ============ -->
<div class="screen" id="sc-practice">
  <h2>智能练习</h2>

  <div class="g2" style="margin-bottom:12px">
    <div class="card" style="cursor:pointer;text-align:center" id="mode-solution" onclick="A.setMode('solution')">
      <div style="font-size:32px">💡</div><div style="font-weight:600">一题多解</div>
      <div style="font-size:11px;color:var(--text2)">一道题，多种解法</div>
    </div>
    <div class="card" style="cursor:pointer;text-align:center" id="mode-pattern" onclick="A.setMode('pattern')">
      <div style="font-size:32px">🔍</div><div style="font-weight:600">多题找规律</div>
      <div style="font-size:11px;color:var(--text2)">多道题，一个规律</div>
    </div>
  </div>

  <div class="card">
    <h3>📋 错题组卷</h3>
    <div style="font-size:13px;color:var(--text2);margin-bottom:8px">从错题本抽取薄弱知识点题目，生成可打印练习卷</div>
    <div class="g2">
      <button class="outline sm block" onclick="A.genPaper('week')">📅 本周巩固</button>
      <button class="outline sm block" onclick="A.genPaper('month')">📆 本月复习</button>
      <button class="outline sm block" onclick="A.genPaper('midterm')">📝 期中冲刺</button>
      <button class="outline sm block" onclick="A.genPaper('final')">📚 期末总复习</button>
    </div>
  </div>

  <div id="practice-area"></div>
</div>

<!-- ============ SCREEN: LIBRARY ============ -->
<div class="screen" id="sc-library">
  <h2>错题本</h2>
  <div style="display:flex;gap:6px;margin-bottom:12px">
    <input type="text" id="lib-search" placeholder="搜索错题..." style="flex:1" oninput="A.renderLibrary()">
    <select id="lib-filter" onchange="A.renderLibrary()" style="width:auto;font-size:14px;padding:8px 12px;border:1px solid #d2d2d7;border-radius:var(--radius-sm)">
      <option value="all">全部</option><option value="active">待复习</option><option value="mastered">已掌握</option>
    </select>
  </div>
  <div id="lib-list"></div>
</div>

<!-- ============ NAVIGATION ============ -->
<nav>
  <a href="javascript:A.nav('add')" class="active" data-nav="add">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg><span>加错题</span>
  </a>
  <a href="javascript:A.nav('analyze')" data-nav="analyze">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>分析</span>
  </a>
  <a href="javascript:A.nav('practice')" data-nav="practice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg><span>练习</span>
  </a>
  <a href="javascript:A.nav('library')" data-nav="library">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span>错题本</span>
  </a>
</nav>

<script>
/* ============================================================
   APP — 简单化·深入化·有用化
   ============================================================ */
const A = {
  _img: null, _kps: [], _mode: null, _state: {},

  $(id){ return document.getElementById(id); },

  toast(msg, t){
    const el = document.createElement('div');
    el.className = 'toast ' + (t||'');
    el.textContent = msg;
    this.$('toast').appendChild(el);
    setTimeout(() => el.remove(), 2500);
  },

  nav(name){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    this.$('sc-' + name).classList.add('active');
    document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
    const navEl = document.querySelector('nav a[data-nav="' + name + '"]');
    if (navEl) navEl.classList.add('active');
    if (name === 'analyze') this.renderAnalyze();
    if (name === 'practice') this.renderPractice();
    if (name === 'library') this.renderLibrary();
  },

  esc(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; },

  /* ============ KNOWLEDGE POINTS ============ */
  KP: {
    composite_shape_area:'组合图形面积',cone_volume:'圆锥体积',cyl_volume:'圆柱体积',
    cyl_surface:'圆柱表面积',composite_solid_volume:'组合体体积',distributive_property:'乘法分配律',
    frac_mul_word:'分数乘法应用',frac_div_word:'分数除法应用',frac_div_eng:'工程问题',
    prop_scale:'比例尺',prop_direct:'正比例',prop_inverse:'反比例',
    pct_discount:'折扣问题',pct_interest:'利率问题',circle_area:'圆的面积',
    circle_pi:'圆的周长',circle_ring:'圆环面积',circle_sector:'扇形面积',
    ratio_distribute:'按比例分配',ratio_simplify:'化简比',negative_numbers:'负数',
    frac_mul_rules:'分数乘法',frac_div_rule:'分数除法',pct_convert:'百分数转化',
    num_pattern_seq:'数列规律',pigeonhole_basic:'鸽巢问题',unit_conversion:'单位换算',
    equation_method:'方程方法',transform_thinking:'转化思想',
  },
  kpName(k){ return this.KP[k] || k; },

  classify(text){
    const map = {
      composite_shape_area:[/组合图形|阴影面积|阴影部分|半圆.*三角|外方内圆|外圆内方|花瓣|环形|圆环|割补|分割|添补/],
      cone_volume:[/圆锥|锥.*体积|沙堆|沙漏|漏斗|粮仓.*锥/],
      cyl_volume:[/圆柱.*体积|圆柱.*容积|水桶.*装|柱子|管道.*体积|圆钢|钢管/],
      cyl_surface:[/表面积|侧面积|铁皮|围成.*圆柱|无盖.*圆柱|通风管|烟囱|水桶.*铁皮/],
      composite_solid_volume:[/组合体|粮仓|圆柱.*上面.*圆锥|组合.*体积/],
      distributive_property:[/简便.*算|简便计算|分配律|提取.*公因数|乘法.*律|简算|能简算/],
      frac_mul_word:[/几分之几|一个数的.*分之|求.*分之.*是多少|的.*分之几/],
      frac_div_word:[/已知.*的.*分之|求.*这个数|单位.*未知|一袋.*吃了.*还剩|一桶.*用了.*还剩/],
      frac_div_eng:[/工程|合作.*天|单独.*天|甲.*乙.*完成|工作效率|修路.*天/],
      prop_scale:[/比例尺|图上距离|实际距离|千米.*厘米|地图/],
      pct_discount:[/打折|折扣|几折|原价|现价|促销|满.*减|折上折|八折|七折|六折|五折|九折/],
      pct_interest:[/利息|本金|利率|存.*年|定期|国债|理财.*收益|取回.*钱/],
      circle_area:[/圆的面积|圆面|半径.*求面积|直径.*求面积|周长.*求面积|圆.*面积/],
      circle_pi:[/周长|一圈|围.*圆|绕.*圈|栅栏.*圆|花坛.*周长/],
      circle_ring:[/环形|圆环|环宽|外圆.*内圆|小路.*圆形/],
      circle_sector:[/扇形|圆心角|扇.*面积|圆弧|钟面.*指针/],
      ratio_distribute:[/按.*分|分配.*比|配比|甲乙.*比|搅拌.*比|混凝土|药粉.*水/],
      negative_numbers:[/负数|零下|低于.*0|亏本|亏损|海平面|海拔.*以下/],
      frac_mul_rules:[/分数.*乘|乘以.*分数|约分.*再乘|分数.*乘法/],
      frac_div_rule:[/分数.*除|除以.*分数|倒数.*乘|÷.*分数|除.*几分之几/],
      pct_convert:[/百分数|百分之|小数.*百分|分数.*百分|互化/],
      prop_direct:[/正比例|成正比例|比值.*一定|单价.*一定|速度.*一定/],
      prop_inverse:[/反比例|成反比例|乘积.*一定/],
      num_pattern_seq:[/规律|找规律|按规律|数列|第n项|第.*个.*数|观察.*算式/],
      pigeonhole_basic:[/至少|保证|抽屉|鸽巢|最坏.*情况|总有.*至少|保证.*同色/],
      unit_conversion:[/单位.*换算|千米.*米|平方米|升.*毫升|吨.*千克|小时.*分钟|厘米.*毫米|换算/],
      equation_method:[/方程|解方程|设.*x|列方程|未知数|解.*=.*x/],
      transform_thinking:[/转化|割补|分割|平移|旋转|等积|添补|辅助线/],
      ratio_simplify:[/化简比|求比值|最简单的整数比|化成.*比/],
    };
    const found = [];
    for (const [k, pats] of Object.entries(map)) {
      if (pats.some(p => p.test(text))) found.push(k);
    }
    return found;
  },
};

/* ============ INDEXEDDB ============ */
const DB = {
  _db: null,
  async open(){
    return new Promise((resolve, reject) => {
      const r = indexedDB.open('MathErrorBookV2', 1);
      r.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('problems')){
          const s = db.createObjectStore('problems', {keyPath:'id',autoIncrement:true});
          s.createIndex('kp','knowledgePoints',{multiEntry:true});
          s.createIndex('status','status');
          s.createIndex('createdAt','createdAt');
        }
        if (!db.objectStoreNames.contains('sessions')){
          db.createObjectStore('sessions',{keyPath:'id',autoIncrement:true});
        }
        if (!db.objectStoreNames.contains('bank')){
          const b = db.createObjectStore('bank',{keyPath:'id',autoIncrement:true});
          b.createIndex('kpk','knowledgePointKey');
        }
      };
      r.onsuccess = (e) => { this._db = e.target.result; resolve(); };
      r.onerror = () => reject(r.error);
    });
  },
  tx(s, m){ return this._db.transaction(s, m).objectStore(s); },
  p(req){ return new Promise((res,rej)=>{ req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); }); },
  async addProblem(d){ d.createdAt = Date.now(); d.status = 'active'; return this.p(this.tx('problems','readwrite').add(d)); },
  async getAllProblems(){ return this.p(this.tx('problems').getAll()); },
  async getProblem(id){ return this.p(this.tx('problems').get(id)); },
  async updateProblem(id, d){ const s=this.tx('problems','readwrite'); const p=await this.p(s.get(id)); if(!p)return; Object.assign(p,d); return this.p(s.put(p)); },
  async deleteProblem(id){ return this.p(this.tx('problems','readwrite').delete(id)); },
  async addSession(d){ d.createdAt=Date.now(); return this.p(this.tx('sessions','readwrite').add(d)); },
  async getAllSessions(){ return this.p(this.tx('sessions').getAll()); },
  async seedBank(qs){ const s=this.tx('bank','readwrite'); for(const q of qs){await this.p(s.add(q));} },

A.handlePhoto = function(e){

  A._img = f;

};

A.clearPhoto = function(){
  A._img = null;
  A.$('photo-empty').style.display = 'block';
  A.$('photo-preview').style.display = 'none';
  A.$('ocr-msg').textContent = '';
};

A.doOCR = async function(){
  if (!A._img) return;
  A.$('btn-ocr').disabled = true;
  A.$('ocr-msg').textContent = '⏳ 加载OCR引擎...';
  try {
    if (!window.Tesseract){
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
        s.onload = res; s.onerror = rej;
        document.head.appendChild(s);
      });
    }
    const worker = await Tesseract.createWorker('chi_sim', 1);
    const img = await createImageBitmap(A._img);
    const scale = Math.min(1, 1500 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = img.width * scale; c.height = img.height * scale;
    const ctx = c.getContext('2d');
    ctx.filter = 'contrast(1.2) grayscale(1)';
    ctx.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
    const { data: { text } } = await worker.recognize(blob);
    const cleaned = text.replace(/(\d)\s*x\s*(\d)/gi, '$1×$2').replace(/X(?=\d)/g, '×').replace(/\s+/g, ' ').trim();
    A.$('prob-text').value = cleaned;
    A._kps = A.classify(cleaned);
    A.updateTagsBar();
    A.$('ocr-msg').textContent = '✅ 识别完成，文字和知识点已自动填入';
    await worker.terminate();
  } catch(e){
    A.$('ocr-msg').textContent = '❌ 识别失败，请手动粘贴题目';
  }
  A.$('btn-ocr').disabled = false;
  A.$('btn-ocr').textContent = '🔍 识别文字';
};

A.onTextChange = function(){
  const t = A.$('prob-text').value.trim();
  if (t.length >= 5) A._kps = A.classify(t);

};

A._batch = [];
A.splitBatch = function(){
  const text = A.$('batch-text').value.trim();
  if (!text) { A.toast('请粘贴错题', 'err'); return; }
  let parts = text.split(/(?:^|\n)\s*\d+[\.\、\)）]\s*/m).filter(s => s.trim().length > 3);
  if (parts.length < 2) parts = text.split(/\n\s*\n/).filter(s => s.trim().length > 3);
  if (parts.length < 2) { A.toast('未识别到多道题', 'err'); return; }
  A._batch = parts.map(p => ({ text: p.trim(), kps: A.classify(p.trim()), ans: '' }));
  A.$('batch-out').innerHTML = A._batch.map((p, i) =>
    '<div class="card" style="margin-bottom:6px"><strong>第'+(i+1)+'题</strong> ' +
    (p.kps.length>0 ? p.kps.map(k => '<span class="tag">'+A.kpName(k)+'</span>').join('') : '<span style="color:var(--orange);font-size:11px">未识别</span>') +
    '<div style="font-size:13px;margin:4px 0">'+A.esc(p.text)+'</div>' +
    '<input type="text" placeholder="正确答案" id="ba-'+i+'" style="font-size:13px"></div>'
  ).join('') + '<button class="primary block" style="margin-top:8px" onclick="A.saveBatch()">💾 保存全部 '+A._batch.length+' 道错题</button>';

A.saveBatch = async function(){
  let n = 0;
  for (let i = 0; i < A._batch.length; i++){
    const ans = A.$('ba-' + i).value.trim();
    if (!ans) continue;
    await DB.addProblem({ problemText:A._batch[i].text, yourAnswer:'', correctAnswer:ans, errorReason:'', knowledgePoints:A._batch[i].kps, semester:1, difficulty:3, errorType:'unknown', hasImage:false, sourceFileType:'batch' });

  }

  A._batch = []; A.$('batch-out').innerHTML = ''; A.$('batch-text').value = '';
};

// Score prediction (有效化 — 分数体验)
A.renderScorePrediction = async function(sorted, totalProblems){
  if (sorted.length === 0){
    A.$('score-prediction').innerHTML = '';
    return;
  }

  // Weight: each knowledge point contributes roughly equally to exam score
  // Estimate: baseline 85 (perfect), subtract errorRate * weight for each KP
  const totalKPs = sorted.length;
  const avgErrorRate = sorted.reduce((s,m) => s + m.errorRate, 0) / totalKPs;
  // Map to a 0-100 score: assume if all mastered = 90+, all wrong = 30-
  let baseScore = Math.round(90 - avgErrorRate * 70);
  baseScore = Math.max(30, Math.min(95, baseScore));

  // Calculate "if fix weakest" score
  let fixedScore = baseScore;
  if (sorted[0] && sorted[0].errorRate > 0.3) {
    const fixImpact = Math.round(sorted[0].errorRate * 15);
    fixedScore = Math.min(95, baseScore + fixImpact);
  }

  // Calculate "if fix all" score
  const allFixedScore = Math.min(95, Math.round(90 - (avgErrorRate * 0.3 * 70)));

  // Improvement path
  const weakOnes = sorted.filter(m => m.errorRate >= 0.3);
  const masteredCount = sorted.filter(m => m.errorRate < 0.1).length;

  // Get past exam questions for weakest KP
  const bank = await DB.getAllBank();
  const examQs = bank.filter(q => {
    if (sorted.length === 0) return false;
    return q.knowledgePointKey === sorted[0].key;
  }).slice(0, 3);

  let html = '<h3>📊 成绩预估</h3>';
  html += '<div style="display:flex;gap:8px;margin-bottom:10px">';
  html += '<div style="flex:1;text-align:center;padding:12px;background:rgba(255,59,48,0.06);border-radius:12px">';
  html += '<div style="font-size:28px;font-weight:700;color:var(--red)">' + baseScore + '分</div>';
  html += '<div style="font-size:11px;color:var(--text2)">当前预估</div></div>';
  html += '<div style="flex:1;text-align:center;padding:12px;background:rgba(255,149,0,0.06);border-radius:12px">';
  html += '<div style="font-size:28px;font-weight:700;color:var(--orange)">' + fixedScore + '分</div>';
  html += '<div style="font-size:11px;color:var(--text2)">攻克最弱项后</div></div>';
  html += '<div style="flex:1;text-align:center;padding:12px;background:rgba(52,199,89,0.06);border-radius:12px">';
  html += '<div style="font-size:28px;font-weight:700;color:var(--green)">' + allFixedScore + '分</div>';
  html += '<div style="font-size:11px;color:var(--text2)">全部掌握后</div></div>';
  html += '</div>';

  // Improvement path
  if (weakOnes.length > 0) {
    html += '<div style="font-weight:600;font-size:14px;margin-bottom:4px">🎯 提分路径</div>';
    html += '<div style="font-size:13px;color:var(--text2);margin-bottom:6px">已掌握 ' + masteredCount + '/' + totalKPs + ' 个知识点，攻克剩余 ' + weakOnes.length + ' 个可提升 ' + (allFixedScore - baseScore) + ' 分</div>';
    for (let i = 0; i < Math.min(weakOnes.length, 4); i++) {
      const w = weakOnes[i];
      const gain = Math.round(w.errorRate * 12);
      html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;font-size:12px">';
      html += '<span style="min-width:18px;color:var(--blue);font-weight:600">' + (i+1) + '.</span>';
      html += '<span style="flex:1">攻克「' + A.esc(w.name) + '」</span>';
      html += '<span style="color:var(--green);font-weight:500">+' + gain + '分</span>';
      html += '<button class="primary sm" style="font-size:11px;padding:4px 10px;min-height:28px" onclick="A.genTargeted(&apos;' + w.key + '&apos;)">练 →</button>';
      html += '</div>';
    }
  }

  // Past exam questions
  if (examQs.length > 0 && sorted.length > 0) {
    html += '<div style="margin-top:10px;font-weight:600;font-size:14px;margin-bottom:4px">📝 「' + A.esc(sorted[0].name) + '」相关真题</div>';
    html += examQs.map((q, i) =>
      '<div class="card" style="margin-bottom:4px;font-size:13px"><strong>真题' + (i+1) + '：</strong>' + A.esc(q.text.substring(0, 80)) +
      (q.text.length > 80 ? '...' : '') + '</div>'
    ).join('');
  }

  A.$('score-prediction').innerHTML = html;
};

A.renderAnalyze = async function(){
  const problems = await DB.getAllProblems();
  if (problems.length === 0){
    A.$('hero').innerHTML = '<div style="text-align:center;padding:20px;color:var(--text2)">还没有错题，去添加第一道吧</div>';
    A.$('radar').innerHTML = A.$('topics').innerHTML = A.$('patterns').innerHTML = A.$('trend').innerHTML = '';
    return;
  }
  const mastery = {};
  for (const p of problems) for (const kp of (p.knowledgePoints||[])){
    if (!mastery[kp]) mastery[kp] = {total:0,errors:0};
    mastery[kp].total++;
    if (p.status !== 'mastered') mastery[kp].errors++;
  }
  const sorted = Object.entries(mastery).map(([k,v]) => ({key:k,name:A.kpName(k),total:v.total,errorRate:v.errors/v.total})).sort((a,b) => b.errorRate - a.errorRate);

  if (sorted.length > 0){
    const w = sorted[0], w2 = sorted.length>1?sorted[1]:null;
    let rc = '';
    if (w.key.includes('composite')||w.key.includes('circle')) rc = '空间想象不足，不会将不规则图形转化为规则图形';
    else if (w.key.includes('cone')) rc = '公式记忆不牢，经常忘记圆锥体积÷3';
    else if (w.key.includes('distributive')) rc = '对分配律理解停留在记忆层面，不会灵活运用';
    else if (w.key.includes('frac')) rc = '分数运算基础不扎实';
    else rc = '基础知识掌握不牢固';
    A.$('hero').innerHTML =
      '<div style="font-weight:700;font-size:18px;margin-bottom:4px">🔴 最需要攻克：<span style="color:var(--red)">'+A.esc(w.name)+'</span></div>' +
      '<div style="font-size:14px;color:var(--text2)">'+w.total+'道错题 · 错误率'+Math.round(w.errorRate*100)+'% · '+rc+'</div>' +
      (w2?'<div style="font-size:13px;color:var(--text2);margin-top:2px">其次是「'+A.esc(w2.name)+'」——'+w2.total+'道错题，错误率'+Math.round(w2.errorRate*100)+'%</div>':'') +
      '<button class="primary sm" style="margin-top:8px" onclick="A.nav(&apos;practice&apos;);A.setMode(&apos;solution&apos;)">🎯 针对性攻克 →</button>';
  }

  // === SCORE PREDICTION (有效化) ===
  A.renderScorePrediction(sorted, problems.length);

  const top6 = sorted.slice(0,6);
  if (top6.length >= 3){
    const W=280,H=260,CX=W/2,CY=H/2,R=100,n=top6.length,step=2*Math.PI/n;
    let svg = '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';

      svg += '<polygon points="'+pts+'" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>';
    }
    for (let i=0;i<n;i++){ const a=-Math.PI/2+i*step; svg+='<line x1="'+CX+'" y1="'+CY+'" x2="'+(CX+R*Math.cos(a)).toFixed(1)+'" y2="'+(CY+R*Math.sin(a)).toFixed(1)+'" stroke="rgba(0,0,0,0.06)"/>'; }
    let pts = '';
    for (let i=0;i<n;i++){ const a=-Math.PI/2+i*step; const v=Math.max(0.05,1-top6[i].errorRate); pts+=((CX+R*v*Math.cos(a))).toFixed(1)+','+((CY+R*v*Math.sin(a))).toFixed(1)+' '; }
    svg += '<polygon points="'+pts+'" fill="rgba(0,113,227,0.12)" stroke="var(--blue)" stroke-width="2"/>';
    for (let i=0;i<n;i++){ const a=-Math.PI/2+i*step; const v=Math.max(0.05,1-top6[i].errorRate); svg+='<circle cx="'+(CX+R*v*Math.cos(a)).toFixed(1)+'" cy="'+(CY+R*v*Math.sin(a)).toFixed(1)+'" r="4" fill="var(--blue)"/>'; }
    for (let i=0;i<n;i++){ const a=-Math.PI/2+i*step; const lx=CX+(R+28)*Math.cos(a),ly=CY+(R+28)*Math.sin(a); const n2=top6[i].name.length>4?top6[i].name.substring(0,4)+'..':top6[i].name; svg+='<text x="'+lx+'" y="'+ly+'" text-anchor="middle" font-size="11" fill="var(--text2)">'+A.esc(n2)+'</text>'; }
    svg += '</svg>';
    A.$('radar').innerHTML = svg;
  } else { A.$('radar').innerHTML = '<div style="color:var(--text3);padding:20px">需要至少3个知识点</div>'; }

  A.$('topics').innerHTML = sorted.slice(0,8).map((m,i) =>
    '<div style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px">' +
    '<span>'+(i<3?'🔴':i<6?'🟠':'🟢')+' '+A.esc(m.name)+'</span>' +
    '<span style="color:'+(m.errorRate>=0.5?'var(--red)':m.errorRate>=0.3?'var(--orange)':'var(--green)')+'">'+Math.round(m.errorRate*100)+'%</span></div>' +
    '<div class="bar"><div class="bar-fill '+(m.errorRate>=0.5?'r':m.errorRate>=0.3?'o':'g')+'" style="width:'+Math.max(5,m.errorRate*100)+'%"></div></div></div>'
  ).join('');

  const pats = [];
  const coneP = problems.filter(p => (p.knowledgePoints||[]).includes('cone_volume') && p.status !== 'mastered');
  if (coneP.length>=2) pats.push({name:'圆锥体积忘乘1/3',count:coneP.length,detail:'写V锥前先在草稿纸上写"1/3×"',misconception:'未建立圆柱与圆锥3倍关系的空间直觉'});
  const distP = problems.filter(p => (p.knowledgePoints||[]).includes('distributive_property') && p.status !== 'mastered');
  if (distP.length>=2) pats.push({name:'分配律使用不当',count:distP.length,detail:'括号里每一项都要乘，逐项检查',misconception:'把分配律和结合律混淆'});
  const compP = problems.filter(p => (p.knowledgePoints||[]).includes('composite_shape_area') && p.status !== 'mastered');
  if (compP.length>=2) pats.push({name:'组合图形分割策略错误',count:compP.length,detail:'先问：能切成几个规则图形？画辅助线',misconception:'转化思想未形成——看到不规则图形不知如何下手'});
  A.$('patterns').innerHTML = pats.length>0 ? pats.map(pp =>
    '<div class="card" style="border-left:3px solid var(--red);margin-bottom:6px"><div style="font-weight:600">⚠️ '+A.esc(pp.name)+' <span class="tag red">出现'+pp.count+'次</span></div>' +
    '<div style="font-size:13px;color:var(--text2);margin-top:4px">💡 '+A.esc(pp.detail)+'</div>' +
    '<div style="font-size:12px;color:var(--orange);margin-top:2px">🎓 深层原因：'+A.esc(pp.misconception)+'</div></div>'
  ).join('') : '<div style="color:var(--text3);text-align:center;padding:12px">数据积累中，继续添加错题后自动分析</div>';

  const sessions = await DB.getAllSessions();
  const recent = [...sessions].sort((a,b) => b.createdAt - a.createdAt).slice(0,6).reverse();
  A.$('trend').innerHTML = recent.length>0 ? recent.map(s => {
    const rate = s.totalQuestions>0 ? Math.round(s.correctCount/s.totalQuestions*100) : 0;
    return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:13px">' +
      '<span style="min-width:70px;color:var(--text3);font-size:12px">'+new Date(s.createdAt).toLocaleDateString('zh-CN')+'</span>' +
      '<div class="bar" style="flex:1"><div class="bar-fill '+(rate>=80?'g':rate>=60?'b':'o')+'" style="width:'+(rate||5)+'%"></div></div>' +
      '<span style="min-width:32px;text-align:right;font-weight:600">'+rate+'%</span></div>';
  }).join('') : '<div style="color:var(--text3);text-align:center;padding:12px">完成练习后显示进步趋势</div>';
};

/* ============ PRACTICE SCREEN ============ */
A.setMode = function(m){ A._mode = (A._mode === m) ? null : m; A.renderPractice(); };

A.renderPractice = function(){
  ['solution','pattern'].forEach(m => {
    const el = A.$('mode-'+m);
    if (el) el.style.border = A._mode === m ? '2px solid var(--blue)' : '2px solid transparent';
  });
  const area = A.$('practice-area');
  if (!A._mode) { area.innerHTML = '<div style="text-align:center;color:var(--text3);padding:20px">👆 选择一种练习模式</div>'; return; }
  if (A._mode === 'solution') A.renderMultiSolution();
  if (A._mode === 'pattern') A.renderPatternMode();
};

A.renderMultiSolution = async function(){
  const problems = await DB.getAllProblems();
  const active = problems.filter(p => p.status !== 'mastered');
  if (active.length === 0) { A.$('practice-area').innerHTML = '<div class="card" style="text-align:center;color:var(--text3)">没有待复习的错题</div>'; return; }
  const p = active[Math.floor(Math.random() * active.length)];
  const bank = await DB.getAllBank();
  const matches = bank.filter(q => (p.knowledgePoints||[]).includes(q.knowledgePointKey));
  const q = matches.length > 0 ? matches[Math.floor(Math.random() * matches.length)] : (bank.length > 0 ? bank[Math.floor(Math.random() * bank.length)] : null);

  A.$('practice-area').innerHTML =
    '<div class="card"><h3>💡 一题多解</h3>' +
    '<div style="font-size:14px;margin-bottom:8px"><strong>题目：</strong>'+A.esc(q&&q.text||p&&p.problemText||'暂无')+'</div>' +
    '<div style="font-size:14px;color:var(--green);margin-bottom:12px"><strong>答案：</strong>'+A.esc(q&&q.answer||p&&p.correctAnswer||'')+'</div>' +
    (q&&q.solutions ? q.solutions.map((s,i) => '<div class="card" style="margin-bottom:4px;background:rgba(0,113,227,0.03)"><div style="font-weight:600;font-size:13px">解法'+(i+1)+'</div><div style="font-size:13px;color:var(--text2)">'+A.esc(s)+'</div></div>').join('') : '<div style="color:var(--text3)">暂无多种解法数据</div>') +
    (q&&q.solution ? '<div style="margin-top:8px;font-size:13px;color:var(--blue)">📐 <strong>通用思路：</strong>'+A.esc(q.solution)+'</div>' : '') +
    '<button class="outline sm" style="margin-top:8px" onclick="A.renderMultiSolution()">🔄 换一题</button></div>';
};

A.renderPatternMode = async function(){
  const problems = await DB.getAllProblems();
  const mastery = {};
  for (const p of problems) for (const kp of (p.knowledgePoints||[])){
    if (!mastery[kp]) mastery[kp] = [];
    mastery[kp].push(p);
  }
  const groups = Object.entries(mastery).filter(([,v]) => v.length >= 3).sort((a,b) => b[1].length - a[1].length);
  if (groups.length === 0) { A.$('practice-area').innerHTML = '<div class="card" style="text-align:center;color:var(--text3)">需要同一知识点至少3道错题</div>'; return; }
  const [kp, probs] = groups[0];
  const patDesc = {
    composite_shape_area:'这些题都在考同一个核心：<strong>把不规则图形变成规则图形</strong>。分割、添补、割补，本质都是"转化"。',
    distributive_property:'这些题都在考<strong>乘法对加法的分配</strong>。核心规律：(a+b)×c=a×c+b×c。正着展开和反着提取是同一个公式。',
    cone_volume:'这些题都涉及<strong>圆锥体积V=Sh/3</strong>。最容易错的地方永远是"除以3"。',
    frac_div_word:'这些题都在考<strong>已知部分求整体</strong>。规律：已知一个数的几分之几是多少→用除法。',
    pct_discount:'这些题都在考<strong>原价×折扣=现价</strong>。几折就是百分之几十。',
  };
  const pat = patDesc[kp] || '这些题属于同一知识点，<strong>解题方法和步骤高度相似</strong>。掌握一道，其他只是换数字。';
  A.$('practice-area').innerHTML =
    '<div class="card"><h3>🔍 多题一规律 — '+A.esc(A.kpName(kp))+'</h3>' +
    '<div class="card" style="background:rgba(0,113,227,0.04);border:1px solid rgba(0,113,227,0.2);margin-bottom:10px"><div style="font-weight:600;font-size:14px;margin-bottom:4px">📐 发现的规律</div><div style="font-size:13px;line-height:1.6">'+pat+'</div></div>' +
    '<div style="font-weight:600;font-size:13px;margin-bottom:6px">对比以下 '+Math.min(probs.length,5)+' 道同类题：</div>' +
    probs.slice(0,5).map((p,i) => '<div class="card" style="margin-bottom:4px"><strong>题'+(i+1)+'：</strong>'+A.esc((p.problemText||'').substring(0,60))+'<div style="font-size:12px;color:var(--green);margin-top:2px">答案：'+A.esc((p.correctAnswer||'').substring(0,40))+'</div></div>').join('') +
    '<button class="primary sm" style="margin-top:8px" onclick="A.genTargeted(&apos;'+kp+'&apos;)">🎯 生成同类题练习 →</button>' +
    '<button class="outline sm" style="margin-left:6px" onclick="A.renderPatternMode()">🔄 换一组</button></div>';
};

A.genTargeted = async function(kp){
  const bank = await DB.getAllBank();
  const qs = bank.filter(q => q.knowledgePointKey === kp);
  if (qs.length === 0) { A.toast('该知识点暂无题库', 'err'); return; }
  A.renderQuiz(qs.sort(() => Math.random() - 0.5).slice(0, 5), A.kpName(kp)+' 针对性练习');
};

A.genPaper = async function(period){
  const problems = await DB.getAllProblems();
  const active = problems.filter(p => p.status !== 'mastered');
  if (active.length === 0) { A.toast('没有待复习的错题', 'err'); return; }
  const now = Date.now(), day = 24*60*60*1000;
  let title = '', count = 0;
  if (period === 'week'){ const wa = now - 7*day; const r = active.filter(p => p.createdAt > wa); if (r.length>0){ A.renderQuiz(r.slice(0,10), '本周错题巩固卷', '最近7天错题回顾'); return; } }
  if (period === 'month'){ const ma = now - 30*day; const r = active.filter(p => p.createdAt > ma); if (r.length>0){ A.renderQuiz(r.slice(0,10), '本月错题复习卷', '最近30天错题综合复习'); return; } }
  if (period === 'midterm'){ title = '期中冲刺卷'; count = 15; }
  if (period === 'final'){ title = '期末总复习卷'; count = 20; }
  const mastery = {};
  for (const p of active) for (const kp of (p.knowledgePoints||[])){ if (!mastery[kp]) mastery[kp] = []; mastery[kp].push(p); }
  let pool = [];
  for (const [,probs] of Object.entries(mastery).sort((a,b) => b[1].length - a[1].length)) pool = pool.concat(probs);
  pool = [...new Set(pool)].slice(0, count || 10);
  A.renderQuiz(pool, title, '覆盖薄弱知识点，查漏补缺');
};

A.renderQuiz = function(problems, title, desc){
  A._state = { problems, title, desc };
  A.$('practice-area').innerHTML =
    '<div class="card"><h3>📋 '+A.esc(title)+'</h3>' +
    (desc ? '<div style="font-size:13px;color:var(--text2);margin-bottom:8px">'+A.esc(desc)+'</div>' : '') +
    '<div style="margin-bottom:8px;font-size:13px;color:var(--text2)">共 '+problems.length+' 题</div>' +
    problems.map((p,i) =>
      '<div class="card" style="margin-bottom:6px"><strong>第'+(i+1)+'题</strong> '+(p.knowledgePoints||[]).map(k => '<span class="tag">'+A.kpName(k)+'</span>').join('')+
      '<div style="font-size:14px;margin:6px 0">'+A.esc(p.problemText||'(无题目文字)')+'</div>'+
      '<input type="text" placeholder="你的答案" id="qz-a-'+i+'" style="font-size:13px"><div id="qz-f-'+i+'" style="margin-top:4px"></div></div>'
    ).join('') +
    '<div style="display:flex;gap:6px"><button class="primary block" onclick="A.checkQuiz()">✅ 提交验证</button><button class="outline sm" onclick="A.printQuiz()">🖨️ 打印</button></div>' +
    '<div id="qz-result" style="margin-top:12px;font-size:15px;font-weight:600;text-align:center"></div></div>';
};

A.checkQuiz = function(){
  const { problems } = A._state;
  let correct = 0;
  for (let i = 0; i < problems.length; i++){
    const ua = A.$('qz-a-' + i).value.trim();
    const fb = A.$('qz-f-' + i);
    if (!ua) { fb.innerHTML = '<span style="color:var(--text3);font-size:12px">未作答</span>'; continue; }
    const exp = (problems[i].correctAnswer || '').replace(/[≈\s]/g, '');
    if (exp && (ua.includes(exp) || exp.includes(ua) || ua === exp)){
      fb.innerHTML = '<span style="color:var(--green);font-size:12px">✅ 正确</span>'; correct++;
    } else {
      fb.innerHTML = '<span style="color:var(--red);font-size:12px">❌ 正确答案：'+A.esc(problems[i].correctAnswer||'')+'</span>';
    }
  }
  const rate = problems.length>0 ? Math.round(correct/problems.length*100) : 0;
  A.$('qz-result').innerHTML = '得分：<span style="font-size:24px;color:'+(rate>=80?'var(--green)':rate>=60?'var(--orange)':'var(--red)')+'">'+rate+'%</span>（'+correct+'/'+problems.length+'）';
  DB.addSession({ mode:'quiz', knowledgePoints:[], totalQuestions:problems.length, correctCount:correct, wrongProblems:[], durationMs:0 });
  for (let i=0;i<problems.length;i++){
    const ua = A.$('qz-a-'+i).value.trim();
    const exp = (problems[i].correctAnswer||'').replace(/[≈\\s]/g,'');
    if (ua && !(exp && (ua.includes(exp)||exp.includes(ua)))) DB.addProblem({ problemText:problems[i].problemText, yourAnswer:ua, correctAnswer:problems[i].correctAnswer||'', errorReason:'组卷练习中做错', knowledgePoints:problems[i].knowledgePoints||[], semester:1, difficulty:3, errorType:'unknown', hasImage:false, sourceFileType:'quiz' });
  }
};

A.printQuiz = function(){
  const { problems, title } = A._state;
  document.querySelectorAll('.screen').forEach(s => s.classList.add('pt'));
  const el = document.createElement('div');
  el.className = 'pp';
  el.innerHTML = '<h2>'+A.esc(title)+'</h2><p style="margin-bottom:12px">姓名：________ 日期：'+new Date().toLocaleDateString('zh-CN')+'</p>' +
    problems.map((p,i) => '<div class="pq"><strong>'+(i+1)+'.</strong> '+A.esc(p.problemText||'')+'<div class="ans"></div></div>').join('');
  document.body.appendChild(el);
  window.print();
  setTimeout(() => { el.remove(); document.querySelectorAll('.screen').forEach(s => s.classList.remove('pt')); }, 500);
};

/* ============ LIBRARY SCREEN ============ */
A.renderLibrary = async function(){
  let problems = await DB.getAllProblems();
  const filter = A.$('lib-filter').value;
  if (filter === 'active') problems = problems.filter(p => p.status !== 'mastered');
  else if (filter === 'mastered') problems = problems.filter(p => p.status === 'mastered');
  const search = A.$('lib-search').value.trim().toLowerCase();
  if (search) problems = problems.filter(p => (p.problemText||'').toLowerCase().includes(search));
  problems.sort((a,b) => b.createdAt - a.createdAt);
  if (problems.length === 0){ A.$('lib-list').innerHTML = '<div style="text-align:center;color:var(--text3);padding:30px">📭 没有错题</div>'; return; }
  A.$('lib-list').innerHTML = problems.map(p =>
    '<div class="card" style="margin-bottom:6px;cursor:pointer" onclick="A.viewProblem('+p.id+')">' +
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">' +
    '<div style="flex:1;min-width:0"><div style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+A.esc(p.problemText||'(拍照题目)')+'</div>' +
    '<div style="margin-top:4px">'+(p.knowledgePoints||[]).map(k => '<span class="tag">'+A.kpName(k)+'</span>').join('') +
    '<span class="tag '+(p.status==='mastered'?'green':'red')+'">'+(p.status==='mastered'?'已掌握':'待复习')+'</span></div></div>' +
    '<span style="font-size:11px;color:var(--text3);white-space:nowrap">'+new Date(p.createdAt).toLocaleDateString('zh-CN')+'</span></div></div>'
  ).join('');
};

A.viewProblem = async function(id){
  const p = await DB.getProblem(id); if (!p) return;
  A.nav('library');
  A.$('lib-list').innerHTML =
    '<div class="card"><button class="outline sm" onclick="A.renderLibrary()">← 返回列表</button></div>' +
    '<div class="card"><h3>题目</h3><div style="font-size:14px;line-height:1.6;white-space:pre-wrap">'+A.esc(p.problemText||'(拍照题目)')+'</div>'+
    (p.imageData?'<img src="'+URL.createObjectURL(p.imageData)+'" style="max-height:250px;margin-top:8px;border-radius:var(--radius-sm)">':'')+'</div>' +
    '<div class="card"><h3>答案对比</h3><div style="display:flex;gap:12px">'+
    '<div style="flex:1"><span style="font-size:11px;color:var(--text3)">错误答案</span><div style="color:var(--red);font-weight:500">'+A.esc(p.yourAnswer||'未记录')+'</div></div>'+
    '<div style="flex:1"><span style="font-size:11px;color:var(--text3)">正确答案</span><div style="color:var(--green);font-weight:500">'+A.esc(p.correctAnswer||'')+'</div></div></div></div>'+
    '<div class="card">'+(p.knowledgePoints||[]).map(k => '<span class="tag">'+A.kpName(k)+'</span>').join('')+'</div>'+
    '<div style="display:flex;gap:6px;margin-top:8px">'+
    (p.status!=='mastered'?'<button class="primary block" onclick="A.markMastered('+p.id+')">✅ 标记已掌握</button>':'<button class="outline block" onclick="A.markActive('+p.id+')">🔄 恢复复习</button>')+
    '<button class="outline block" onclick="A.deleteProblem('+p.id+')">🗑️ 删除</button></div>';
};

A.markMastered = async function(id){ await DB.updateProblem(id, {status:'mastered'}); A.toast('已掌握 👍', 'ok'); A.viewProblem(id); };
A.markActive = async function(id){ await DB.updateProblem(id, {status:'active'}); A.toast('已恢复', 'ok'); A.viewProblem(id); };
A.deleteProblem = async function(id){ if(!confirm('确认删除？'))return; await DB.deleteProblem(id); A.toast('已删除'); A.renderLibrary(); };

/* ============ INIT ============ */
(async function(){
  try {
    await DB.open();
    if (await DB.getBankCount() === 0) await DB.seedBank(SEED);
    if ('serviceWorker' in navigator){
      const sw = 'self.addEventListener("install",e=>{e.waitUntil(caches.open("meb").then(c=>c.addAll([self.location.href])))});self.addEventListener("fetch",e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))});';
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});
    }
  } catch(e){ console.error('Init:', e); }
})();
</script>
